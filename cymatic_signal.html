<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cymatic Signal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ── UI overlay — fades on inactivity ── */
#ui {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center; z-index: 10;
  opacity: 1; transition: opacity 2s ease;
}
#ui.hidden { opacity: 0; pointer-events: none; }

.btn {
  background: rgba(4,6,14,0.75);
  border: 1px solid rgba(120,170,200,0.18);
  color: rgba(150,195,225,0.5);
  padding: 7px 18px; font-size: 9px;
  letter-spacing: 0.38em; text-transform: uppercase; cursor: pointer;
  font-family: 'Orbitron', 'Courier New', monospace;
  transition: all 0.2s; backdrop-filter: blur(6px);
}
.btn:hover, .btn.active {
  background: rgba(10,25,55,0.75);
  border-color: rgba(120,200,255,0.45);
  color: rgba(200,230,255,0.92);
}
.btn.mic-live {
  border-color: rgba(80,220,150,0.5);
  color: rgba(120,240,180,0.9);
}
.sep { width: 1px; height: 18px; background: rgba(120,170,200,0.12); }

#mode-label {
  position: fixed; top: 24px; right: 28px;
  font-family: 'Orbitron', monospace;
  font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase;
  color: rgba(150,190,220,0.22);
  transition: opacity 2s ease;
}
#mode-label.hidden { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mode-label">BIO — LIVING SIGNAL</div>
<div id="ui">
  <button class="btn" id="mic-btn" onclick="toggleMic()">⊙ mic</button>
  <div class="sep"></div>
  <button class="btn active" onclick="setFilter('bio',this)">bio</button>
  <button class="btn" onclick="setFilter('forge',this)">forge</button>
  <button class="btn" onclick="setFilter('void',this)">void</button>
  <button class="btn" onclick="setFilter('plasma',this)">plasma</button>
  <button class="btn" onclick="setFilter('raw',this)">raw</button>
  <button class="btn" onclick="setFilter('rainbow',this)">rainbow</button>
</div>
<script>
'use strict';
const TAU = Math.PI * 2;

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width  = window.innerWidth  * dpr;
  H = canvas.height = window.innerHeight * dpr;
}
resize();
window.addEventListener('resize', resize);

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx, analyser, freqData, timeData;
let listening = false;

const BANDS = {
  sub:     { lo: 0,   hi: 4,   val: 0, smooth: 0 },
  bass:    { lo: 4,   hi: 12,  val: 0, smooth: 0 },
  lowmid:  { lo: 12,  hi: 30,  val: 0, smooth: 0 },
  mid:     { lo: 30,  hi: 70,  val: 0, smooth: 0 },
  highmid: { lo: 70,  hi: 110, val: 0, smooth: 0 },
  high:    { lo: 110, hi: 160, val: 0, smooth: 0 },
  air:     { lo: 160, hi: 255, val: 0, smooth: 0 },
};

const BAND_KEYS = ['sub','bass','lowmid','mid','highmid','high','air'];
const waveform  = new Float32Array(64);
let energy = 0, prevEnergy = 0, kickFlash = 0;
const ripples = [];

async function toggleMic() {
  if (listening) return;
  const btn = document.getElementById('mic-btn');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.78;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.frequencyBinCount);
    listening = true;
    btn.textContent = '● live';
    btn.classList.add('mic-live');
  } catch(e) {
    btn.textContent = 'mic blocked';
  }
}

function analyzeAudio() {
  if (!listening || !analyser) return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);

  for (const bk of BAND_KEYS) {
    const b = BANDS[bk];
    let s = 0;
    for (let i = b.lo; i < b.hi; i++) s += freqData[i];
    const raw = s / ((b.hi - b.lo) * 255);
    b.val    = b.val    * 0.70 + raw * 0.30;
    b.smooth = b.smooth * 0.92 + raw * 0.08;
  }

  for (let i = 0; i < 64; i++)
    waveform[i] = waveform[i] * 0.55 + ((timeData[i * 4] - 128) / 128) * 0.45;

  energy = (BANDS.bass.val + BANDS.mid.val + BANDS.high.val) / 3;

  // Kick detection — sharp bass transient
  const bassNow = (BANDS.bass.val + BANDS.sub.val) * 0.5;
  if (bassNow > prevEnergy * 1.75 && bassNow > 0.18) {
    kickFlash = Math.min(1, kickFlash + bassNow);
    addRipple();
  }
  prevEnergy = prevEnergy * 0.88 + bassNow * 0.12;
  kickFlash *= 0.88;
}

function addRipple() {
  // Capture nodal color at kick moment (uses live interpolated filter)
  ripples.push({ r: 0.03, alpha: 0.6 + kickFlash * 0.4, color: getF().nodal });
}

function updateRipples() {
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].r     += 0.012;
    ripples[i].alpha -= 0.018;
    if (ripples[i].alpha <= 0 || ripples[i].r >= 1.05) ripples.splice(i, 1);
  }
}

// ── Filter presets ────────────────────────────────────────────────────────────
//
// Subtractive coloration: cells start near-white, MULTIPLY pass removes
// complementary hues. Silence → minimal subtraction. Sound → deeper color.
// The remainder IS the signal.
//
const FILTERS = {
  bio: {
    name: 'BIO — LIVING SIGNAL',   bg: '#010b07',
    cellHue: 168, cellSat: 78,
    nodal: 'rgba(100,240,190,',    glow: [20, 220, 130],
    mul:   'rgba(0,80,60,',        rimHue: 160,
  },
  forge: {
    name: 'FORGE — HEAT TREATED',  bg: '#090400',
    cellHue: 28, cellSat: 88,
    nodal: 'rgba(255,175,55,',     glow: [255, 100, 15],
    mul:   'rgba(60,20,0,',        rimHue: 25,
  },
  void: {
    name: 'VOID — COLD COMPRESSION', bg: '#000308',
    cellHue: 210, cellSat: 72,
    nodal: 'rgba(100,185,255,',    glow: [40, 120, 255],
    mul:   'rgba(0,10,50,',        rimHue: 215,
  },
  plasma: {
    name: 'PLASMA — EXCITED STATE', bg: '#060010',
    cellHue: 275, cellSat: 90,
    nodal: 'rgba(200,100,255,',    glow: [180, 30, 255],
    mul:   'rgba(30,0,60,',        rimHue: 285,
  },
  raw: {
    name: 'RAW — UNFILTERED',      bg: '#030303',
    cellHue: 185, cellSat: 30,
    nodal: 'rgba(220,238,245,',    glow: [200, 230, 255],
    mul:   'rgba(5,5,10,',         rimHue: 0,
  },
  rainbow: {
    // Light background so multiply interactions are visible as deepened color.
    // Each sector gets its own hue; adjacent sectors + ring boundaries overlap
    // slightly and subtract (multiply) rather than add — kaleidoscope physics.
    name: 'RAINBOW — KALEIDOSCOPE', bg: '#f2f0ed',
    cellHue: 0, cellSat: 90,
    nodal: 'rgba(30,10,50,',        glow: [110, 50, 180],
    mul:   'rgba(255,255,255,',     rimHue: 300,
    rainbow: true,
  },
};

// ── Filter interpolation system ───────────────────────────────────────────────
// All filter properties are parsed into numeric form so they can be
// linearly interpolated. setFilter() snapshots the current mid-transition
// state as the new "from" so rapid filter switches never hard-cut.

function hexToRgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function rgbaPrefixToRgb(s) {
  const m = s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  return m ? [+m[1], +m[2], +m[3]] : [0, 0, 0];
}
function parseFilterN(f) {
  return {
    name:    f.name,
    bg:      hexToRgb(f.bg),
    cellHue: f.cellHue,
    cellSat: f.cellSat,
    nodal:   rgbaPrefixToRgb(f.nodal),
    glow:    [...f.glow],
    mul:     rgbaPrefixToRgb(f.mul),
    rimHue:  f.rimHue,
    rainbow: f.rainbow ? 1 : 0,
  };
}
function cloneFxN(n) {
  return { name: n.name, bg: [...n.bg], cellHue: n.cellHue, cellSat: n.cellSat,
           nodal: [...n.nodal], glow: [...n.glow], mul: [...n.mul], rimHue: n.rimHue,
           rainbow: n.rainbow ?? 0 };
}

const FILTERS_N = {};
for (const k in FILTERS) FILTERS_N[k] = parseFilterN(FILTERS[k]);

let fxFrom = cloneFxN(FILTERS_N.bio);
let fxTo   = cloneFxN(FILTERS_N.bio);
let fxT    = 1.0;               // 0 = at fxFrom, 1 = complete transition to fxTo
const FX_DUR = 900;             // ms — filter crossfade duration

// smoothstep easing for the crossfade
function smoothstep(t) { return t * t * (3 - 2 * t); }
function lv(a, b, t)   { return a + (b - a) * t; }
function lc(a, b, t)   { return a.map((v, i) => lv(v, b[i], t)); }

// Returns current interpolated filter in numeric form (fresh arrays every call)
function currentFxN() {
  const t = smoothstep(Math.min(fxT, 1));
  return {
    name:    fxTo.name,
    bg:      lc(fxFrom.bg,    fxTo.bg,    t),
    cellHue: lv(fxFrom.cellHue, fxTo.cellHue, t),
    cellSat: lv(fxFrom.cellSat, fxTo.cellSat, t),
    nodal:   lc(fxFrom.nodal,  fxTo.nodal,  t),
    glow:    lc(fxFrom.glow,   fxTo.glow,   t),
    mul:     lc(fxFrom.mul,    fxTo.mul,    t),
    rimHue:  lv(fxFrom.rimHue, fxTo.rimHue, t),
    rainbow: lv(fxFrom.rainbow, fxTo.rainbow, t),
  };
}

// Returns the F object the renderer expects — strings where the renderer
// uses strings, numbers where it uses numbers.
function getF() {
  const n = currentFxN();
  const ri = v => Math.round(v);
  return {
    name:    n.name,
    bg:      `rgb(${ri(n.bg[0])},${ri(n.bg[1])},${ri(n.bg[2])})`,
    cellHue: n.cellHue,
    cellSat: n.cellSat,
    nodal:   `rgba(${ri(n.nodal[0])},${ri(n.nodal[1])},${ri(n.nodal[2])},`,
    glow:    n.glow,
    mul:     `rgba(${ri(n.mul[0])},${ri(n.mul[1])},${ri(n.mul[2])},`,
    rimHue:  n.rimHue,
    rainbow: n.rainbow,
  };
}

let currentFilter = 'bio';
function setFilter(name, el) {
  currentFilter = name;
  // Snapshot current mid-transition state so a rapid switch cross-fades
  // from wherever we actually are, not from the old start point.
  fxFrom = currentFxN();
  fxTo   = cloneFxN(FILTERS_N[name]);
  fxT    = 0;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('mode-label').textContent = FILTERS[name].name;
  showUI();
}

// ── Smooth cymatic state (audio-driven) ───────────────────────────────────────
//
// dt-scaled exponential smoothing: eLerp converges at the same rate
// regardless of frame rate. tau = time constant in ms (63% of the way
// to target in tau ms, 95% in 3×tau ms).
//
function eLerp(cur, tgt, tau, dt) {
  return cur + (tgt - cur) * (1 - Math.exp(-dt / tau));
}

const cym = {
  m:         6,      // fold count — float; wave function uses directly for smooth morph
  rings:     3,      // ring count — float; fractional part drives outermost ring fade
  ar:        0.10,   // petal A/R ratio
  h2:        0.22,   // 2nd harmonic fraction
  cellFrac:  0.78,   // angular sector fill
  rot:       0,      // current rotation angle
  rotSpeed:  0.00012,
  scale:     1.0,    // breathing scale
  glow:      0.35,
};

// Returns a continuous float fold-count target from the band energy distribution.
// No Math.round here — the lerp chases a float, so cym.m morphs continuously
// between fold counts rather than jumping between integers.
function targetM() {
  const w = [2, 4, 6, 8, 10, 12, 14];
  let num = 0, den = 0;
  BAND_KEYS.forEach((k, i) => { const v = BANDS[k].val; num += v * w[i]; den += v; });
  return den > 0.02 ? Math.max(2, Math.min(16, num / den)) : 6;
}

function updateCym(dt) {
  const { sub, bass, mid, highmid } = BANDS;
  const e = energy;

  // Time constants (ms): larger = smoother, slower to track audio
  cym.m        = eLerp(cym.m,        targetM(),                                   1200, dt);
  cym.rings    = eLerp(cym.rings,    Math.max(2, 2 + bass.val * 5),                800, dt);
  cym.ar       = eLerp(cym.ar,       0.06 + mid.val     * 0.20,                    160, dt);
  cym.h2       = eLerp(cym.h2,       0.10 + highmid.val * 0.55,                    140, dt);
  cym.cellFrac = eLerp(cym.cellFrac, 0.72 - e * 0.12,                              240, dt);
  cym.rotSpeed = eLerp(cym.rotSpeed, 0.00006 + e * 0.00035,                        350, dt);
  cym.scale    = eLerp(cym.scale,    1.0 + sub.val * 0.07 + bass.val * 0.04,       110, dt);
  cym.glow     = eLerp(cym.glow,     0.25 + e * 0.75,                              420, dt);
  cym.rot     += cym.rotSpeed * dt;

  // Advance filter crossfade clock
  if (fxT < 1) fxT = Math.min(1, fxT + dt / FX_DUR);
}

// ── Persistent ring state — smooth positions + fade-in / fade-out ─────────────
//
// Rings are never created or destroyed mid-frame. Each slot carries a
// persistent position (normR) that lerps toward its target placement, and a
// weight (0–1) that lerps toward 0 when the slot is inactive and toward 1
// when active. Drawing multiplies cell/stroke alpha by weight, so rings
// dissolve in and out instead of popping.
//
// The float value of cym.rings drives weight directly: the ring at index
// Math.floor(cym.rings) gets weight = fractional part of cym.rings, so
// the incoming ring fades in continuously as cym.rings rises through the
// next integer.

const MAX_RINGS = 5;
const ringState = Array.from({ length: MAX_RINGS }, (_, i) => ({
  normR:  (i + 1) / (MAX_RINGS + 1),
  v:      128,
  weight: i < 3 ? 1 : 0,  // match cym.rings default of 3
}));

function updateRings(dt) {
  const rFloat = Math.max(2, cym.rings);
  const nFull  = Math.floor(rFloat);   // rings with full target weight
  const frac   = rFloat - nFull;       // incoming ring's target weight (0→1)

  // How many target rings total (including the partial incoming one)?
  const nTarget = Math.min(nFull + 1, MAX_RINGS);

  for (let i = 0; i < MAX_RINGS; i++) {
    // Determine target weight for this slot
    let targetW;
    if      (i < nFull)      targetW = 1.0;
    else if (i === nFull)    targetW = frac;   // the arriving ring
    else                     targetW = 0.0;

    // Lerp weight — fade time 280ms in, 220ms out
    const wTau = targetW > ringState[i].weight ? 280 : 220;
    ringState[i].weight = eLerp(ringState[i].weight, targetW, wTau, dt);

    // Target radial position — distribute active rings evenly in the field
    const tT = (i + 1) / (nTarget + 1);
    const bk  = BAND_KEYS[Math.min(BAND_KEYS.length - 1, Math.floor(tT * BAND_KEYS.length))];
    const fv  = BANDS[bk].val;
    const tR  = Math.min(0.88, 0.14 + tT * 0.74 + fv * 0.02 * (1 - tT));

    // Lerp position — 350ms so rings glide when count changes
    ringState[i].normR = eLerp(ringState[i].normR, tR, 350, dt);
    ringState[i].v     = eLerp(ringState[i].v, 70 + fv * 185, 120, dt);
  }
}

// ── Build render state from smooth ring + cym values ─────────────────────────
function buildState() {
  // mFloat: continuous fold count — passed to wave function _rp() for smooth
  //         petal-shape morphing (non-integer m gives valid, beautiful waves
  //         within each sector arc).
  // mInt:   integer fold count — used only for cell/spoke count loops and
  //         full-ring strokes that need to close perfectly.
  const mFloat = Math.max(2, cym.m);
  const mInt   = Math.max(2, Math.round(mFloat));

  // Only include rings with non-negligible weight
  const active = ringState
    .filter(r => r.weight > 0.008)
    .sort((a, b) => a.normR - b.normR);

  const peaks  = active.map(r => ({ normR: r.normR, v: r.v, weight: r.weight }));
  const bounds = [0, ...active.map(r => r.normR), 0.9];

  const bands = [];
  for (let i = 0; i < bounds.length - 1; i++) {
    const r1  = bounds[i], r2 = bounds[i + 1];
    const mid = (r1 + r2) * 0.5;
    const bk  = BAND_KEYS[Math.min(BAND_KEYS.length - 1, Math.floor(mid * BAND_KEYS.length))];
    const fv  = BANDS[bk].val;
    // Band weight = weight of the ring that bounds it from above
    // (last band uses the last ring's weight since nothing bounds it above)
    const w = i < peaks.length ? peaks[i].weight : peaks[peaks.length - 1]?.weight ?? 1;
    bands.push({
      innerNorm: r1,
      outerNorm: r2,
      amplitude: Math.max(0.08, listening ? 0.12 + fv * 0.88 : 0.35 + i * 0.08),
      weight: w,
    });
  }

  return { peaks, bands, mFloat, mInt };
}

// ── Sine ring primitives ──────────────────────────────────────────────────────
// r(θ) = R + A·sin(m·θ + ph) + A·h2·sin(2m·θ + ph·1.1 + 0.4)
// Using a float m means the petal count morphs continuously — the ring
// boundary is a smooth wave that transitions between fold counts without
// any hard geometric jump.

function _rp(R, A, A2, m, ph, θ) {
  return R + A * Math.sin(m*θ + ph) + A2 * Math.sin(2*m*θ + ph*1.1 + 0.4);
}

// Draw m discrete CELLS for one ring band.
// mWave = float fold count (drives wave shape — morphs continuously)
// mCells = integer fold count (drives sector count — changes by ±1)
// The separation means petal shapes glide smoothly even as cell count snaps.
function drawCells(cx, cy, Ro, Ao, Ao2, Ri, Ai, Ai2, mWave, mCells, pho, phi, angOff, frac, color) {
  const secArc = TAU / mCells;
  const half   = secArc * frac * 0.5;
  const N      = Math.max(18, Math.ceil(secArc * frac / TAU * 720));

  for (let ci = 0; ci < mCells; ci++) {
    const mid = (ci / mCells) * TAU + angOff;
    const θ0  = mid - half, θ1 = mid + half;

    ctx.beginPath();
    // Outer arc CW — wave shape uses mWave for continuous morph
    for (let i = 0; i <= N; i++) {
      const θ = θ0 + (i/N) * (θ1-θ0);
      const r = _rp(Ro, Ao, Ao2, mWave, pho, θ);
      ctx.lineTo(cx + Math.cos(θ)*r, cy + Math.sin(θ)*r);
    }
    // Inner arc CCW (hole)
    if (Ri > 1) {
      for (let i = N; i >= 0; i--) {
        const θ = θ0 + (i/N) * (θ1-θ0);
        const r = _rp(Ri, Ai, Ai2, mWave, phi, θ);
        ctx.lineTo(cx + Math.cos(θ)*r, cy + Math.sin(θ)*r);
      }
    } else {
      ctx.lineTo(cx, cy);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
}

// strokeRing uses mInt so the path closes exactly (non-integer m leaves an
// unclosed seam that becomes a visible kink at the closure point).
function strokeRing(cx, cy, R, A, A2, m, ph, color, lw, blur) {
  ctx.save();
  if (blur) { ctx.shadowBlur = blur; ctx.shadowColor = color; }
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath();
  const N = Math.max(360, m * 60);
  for (let i = 0; i <= N; i++) {
    const θ = (i/N)*TAU;
    const r = _rp(R, A, A2, m, ph, θ);
    ctx.lineTo(cx + Math.cos(θ)*r, cy + Math.sin(θ)*r);
  }
  ctx.closePath(); ctx.stroke(); ctx.restore();
}

// ── Rainbow band — per-sector hue, multiply blend ─────────────────────────────
//
// Each of the m sector-cells gets a unique hue from the full 360° wheel.
// Adjacent rings mirror the hue direction (CW vs CCW) to create the
// kaleidoscope reflection effect.
//
// Subtractive interactions come from two intentional overlaps:
//   Angular: each cell is drawn slightly wider than its nodal gap, so
//            adjacent sectors overlap at their edges — multiply there
//            produces a darkened, mixed hue rather than a bright border.
//   Radial:  each non-innermost band extends slightly inward past the
//            ring boundary, so adjacent rings overlap at the wavy boundary.
//
// On the near-white background, multiply(A, B) = A × B / 255 — darker
// and more saturated than either alone. Silence = wide open cells,
// near-pure hues. Sound drives amplitude → lighter cells → more contrast
// at the overlap zones.
//
function drawRainbowBand(cx, cy, Ro, Ao, Ao2, Ri, Ai, Ai2, mWave, mCells,
                          pho, phi, angOff, frac, bandIdx, numBands,
                          weight, amplitude) {
  // Angular expansion for overlap at sector edges
  const expFrac = Math.min(0.99, frac + 0.11);
  // Radial inward extension for overlap at ring boundaries (skip innermost band)
  const RiExp   = bandIdx > 0 ? Math.max(0, Ri * 0.92) : Ri;

  const secArc = TAU / mCells;
  const half   = secArc * expFrac * 0.5;
  const N      = Math.max(18, Math.ceil(secArc * expFrac / TAU * 720));

  for (let ci = 0; ci < mCells; ci++) {
    const center = (ci / mCells) * TAU + angOff;
    const θ0 = center - half, θ1 = center + half;

    // Mirror hue direction on alternating rings → kaleidoscope reflections
    const mirror  = (bandIdx % 2 === 0) ? 1 : -1;
    const hueBase = (ci / mCells) * 360 * mirror;
    // Stagger rings by half the spectrum so ring 0 and ring 1 are
    // complementary — their overlap zone subtracts to a deep neutral.
    const hueOff  = (bandIdx / Math.max(1, numBands - 1)) * 180;
    const rawHue  = hueBase + hueOff + cym.rot * (90 / Math.PI);
    const hue     = ((rawHue % 360) + 360) % 360;

    // Amplitude controls lightness: higher = lighter cells = more vivid
    // interaction at overlap zones (multiply of two light colors is medium)
    const light = 46 + amplitude * 16 + weight * 6;
    const alpha = (0.88 + Math.sin(cym.rot * mCells + ci) * 0.04) * weight;

    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const θ = θ0 + (i/N) * (θ1-θ0);
      const r = _rp(Ro, Ao, Ao2, mWave, pho, θ);
      ctx.lineTo(cx + Math.cos(θ)*r, cy + Math.sin(θ)*r);
    }
    if (RiExp > 1) {
      for (let i = N; i >= 0; i--) {
        const θ = θ0 + (i/N) * (θ1-θ0);
        const r = _rp(RiExp, Ai, Ai2, mWave, phi, θ);
        ctx.lineTo(cx + Math.cos(θ)*r, cy + Math.sin(θ)*r);
      }
    } else {
      ctx.lineTo(cx, cy);
    }
    ctx.closePath();
    ctx.fillStyle = `hsla(${hue}, 90%, ${light}%, ${alpha})`;
    ctx.fill();
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(now, dt) {
  const F = getF();   // live-interpolated filter — smooth across transitions
  const cx = W/2, cy = H/2;
  const maxR = Math.min(cx, cy) * 0.88;
  const { peaks, bands, mFloat, mInt } = buildState();

  const R_scale  = maxR * cym.scale * (1 + kickFlash * 0.06);
  const rot      = cym.rot;
  const ar       = cym.ar  * (1 + kickFlash * 0.4);
  const h2       = cym.h2;
  const cellFrac = Math.max(0.55, cym.cellFrac);
  const e        = energy;

  // ── Background ─────────────────────────────────────────────────────────────
  ctx.fillStyle = F.bg;
  ctx.fillRect(0, 0, W, H);

  const isRainbow = F.rainbow > 0.5;

  // Vignette — on white bg use a soft inward shadow instead of black fade
  const vg = ctx.createRadialGradient(cx, cy, R_scale*0.1, cx, cy, R_scale*1.3);
  if (isRainbow) {
    vg.addColorStop(0, 'rgba(255,255,255,0)');
    vg.addColorStop(1, 'rgba(200,195,210,0.45)');
  } else {
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.8)');
  }
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // ── Cells ──────────────────────────────────────────────────────────────────
  // Rainbow: multiply blend on white bg — every overlap subtracts (deepens).
  // Normal:  source-over on dark bg with uniform filter hue.
  ctx.globalCompositeOperation = isRainbow ? 'multiply' : 'source-over';

  for (let b = 0; b < bands.length; b++) {
    const band = bands[b];
    if (band.amplitude < 0.04 || band.weight < 0.01) continue;

    const Ro  = band.outerNorm * R_scale;
    const Ri  = band.innerNorm * R_scale;

    const Ao  = Ro * ar,        Ao2 = Ao * h2;
    const Ai  = Ri * ar * 0.8,  Ai2 = Ai * h2;

    const sign   = (b % 2 === 0) ? 1 : -1;
    const pho    = sign * rot;
    const phi    = sign * rot + Math.PI / mFloat;
    const angOff = (b % 2 === 0) ? rot * 0.3 : rot * 0.3 + Math.PI / mFloat;

    if (isRainbow) {
      drawRainbowBand(cx, cy, Ro, Ao, Ao2, Ri, Ai, Ai2, mFloat, mInt,
                      pho, phi, angOff, cellFrac, b, bands.length,
                      band.weight, band.amplitude);
    } else {
      const light = 42 + band.amplitude * 28 + kickFlash * 18;
      const sat   = F.cellSat - (1 - band.amplitude) * 20;
      const alpha = band.amplitude * 0.75
                  * (0.85 + Math.sin(now*0.00085+b)*0.1)
                  * band.weight;
      drawCells(cx, cy, Ro, Ao, Ao2, Ri, Ai, Ai2, mFloat, mInt,
                pho, phi, angOff, cellFrac,
                `hsla(${F.cellHue}, ${sat}%, ${light}%, ${alpha})`);
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  // ── Subtractive filter overlay ──────────────────────────────────────────────
  // MULTIPLY blend removes the complement of the filter color.
  // F.mul is now an interpolated rgba — color transitions happen here too.
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  const mulAlpha = 0.30 + e * 0.42 + kickFlash * 0.1;
  ctx.fillStyle = `${F.mul}${mulAlpha})`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // Overlay contrast boost
  if (e > 0.05) {
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = e * 0.18;
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R_scale);
    cg.addColorStop(0,   'rgba(255,255,255,1)');
    cg.addColorStop(0.6, 'rgba(0,0,0,0)');
    cg.addColorStop(1,   'rgba(0,0,0,1)');
    ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ── Nodal spokes ────────────────────────────────────────────────────────────
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = `${F.nodal}0.08)`;
  ctx.lineWidth   = 0.7;
  for (let ci = 0; ci < mInt; ci++) {
    const θ = ((ci + 0.5) / mInt) * TAU + rot * 0.3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(θ)*R_scale*1.02, cy + Math.sin(θ)*R_scale*1.02);
    ctx.stroke();
  }

  // ── Nodal ring strokes — weight-faded ──────────────────────────────────────
  for (let i = 0; i < peaks.length; i++) {
    const pk    = peaks[i];
    if (pk.weight < 0.01) continue;
    const R     = pk.normR * R_scale;
    const A     = R * ar * 0.62;
    const A2    = A * h2;
    const sign  = (i % 2 === 0) ? 1 : -1;
    const ph    = sign * rot;
    const pulse = 0.82 + Math.sin(now * 0.0017 + i * 1.5) * 0.1;
    const alpha = (0.32 + (pk.v / 255) * 0.40) * pulse * pk.weight;  // ← weight

    strokeRing(cx, cy, R, A, A2, mInt, ph, `${F.nodal}${alpha*0.38})`, 3.5, 12);
    strokeRing(cx, cy, R, A, A2, mInt, ph, `${F.nodal}${alpha})`,      1.1, 0);
  }

  // ── Ripple rings (kick response) ────────────────────────────────────────────
  if (!isRainbow) {
    ctx.globalCompositeOperation = 'screen';
    for (const rp of ripples) {
      ctx.strokeStyle = `${rp.color}${rp.alpha * 0.7})`;
      ctx.lineWidth   = 1.2;
      ctx.beginPath();
      ctx.arc(cx, cy, rp.r * maxR, 0, TAU);
      ctx.stroke();
    }
  } else {
    // On white bg: screen = invisible; use multiply to darken the ring outline
    ctx.globalCompositeOperation = 'multiply';
    for (const rp of ripples) {
      const kickHue = (((cym.rot * 90 / Math.PI) % 360) + 360) % 360;
      ctx.strokeStyle = `hsla(${kickHue}, 75%, 35%, ${rp.alpha * 0.55})`;
      ctx.lineWidth   = 1.8;
      ctx.beginPath();
      ctx.arc(cx, cy, rp.r * maxR, 0, TAU);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ── Brushed metal texture ────────────────────────────────────────────────────
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.03;
  for (let y = 0; y < H; y += 3) {
    const bri = 0.4 + 0.6 * Math.abs(Math.sin(y * 0.06));
    ctx.fillStyle = `rgba(255,255,255,${bri})`;
    ctx.fillRect(0, y, W, 1);
  }
  ctx.globalAlpha = 1;

  // ── Rim light / boundary ring ───────────────────────────────────────────────
  // Normal: glowing screen rim. Rainbow: dark multiply outline (visible on white).
  if (!isRainbow) {
    ctx.globalCompositeOperation = 'screen';
    const outerA  = R_scale * ar * 0.5;
    const outerA2 = outerA * h2;
    const rimA    = 0.10 + e * 0.14 + kickFlash * 0.12;
    strokeRing(cx, cy, R_scale, outerA, outerA2, mInt, rot,
               `${F.nodal}${rimA})`, 1.0, 8);
  } else {
    ctx.globalCompositeOperation = 'multiply';
    const outerA  = R_scale * ar * 0.5;
    const outerA2 = outerA * h2;
    const rimA    = 0.18 + e * 0.22 + kickFlash * 0.15;
    strokeRing(cx, cy, R_scale, outerA, outerA2, mInt, rot,
               `${F.nodal}${rimA})`, 1.2, 0);
    ctx.globalCompositeOperation = 'source-over';
  }

  // ── Core — glow (dark modes) / iris (rainbow) ───────────────────────────────
  const pR    = (4.5 + Math.sin(now * 0.0028) * 1.1) * (1 + kickFlash * 0.5);
  const gRad  = Math.max(pR * 5, 15);
  const [gr, gg, gb] = F.glow;
  ctx.globalCompositeOperation = 'source-over';

  if (!isRainbow) {
    const coreG = ctx.createRadialGradient(cx, cy, 0, cx, cy, gRad * (1 + cym.glow * 0.8));
    coreG.addColorStop(0,    `rgba(${gr+55|0},${gg+55|0},${gb+55|0},${0.85 + kickFlash*0.1})`);
    coreG.addColorStop(0.25, `rgba(${gr|0},${gg|0},${gb|0},${0.45 * cym.glow})`);
    coreG.addColorStop(0.65, `rgba(${gr*0.4|0},${gg*0.4|0},${gb*0.4|0},0.15)`);
    coreG.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = coreG;
    ctx.beginPath(); ctx.arc(cx, cy, gRad*(1+cym.glow*0.8), 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(${gr+60|0},${gg+60|0},${gb+60|0},0.97)`;
  } else {
    // Dark iris on white: anchors the pattern, color rotates with rot
    const irisHue = (((cym.rot * 120 / Math.PI) % 360) + 360) % 360;
    const irisR   = gRad * (0.7 + cym.glow * 0.5);
    const irisG   = ctx.createRadialGradient(cx, cy, 0, cx, cy, irisR);
    irisG.addColorStop(0,   `hsla(${irisHue}, 70%, 25%, ${0.65 + kickFlash * 0.25})`);
    irisG.addColorStop(0.5, `hsla(${irisHue}, 60%, 35%, 0.30)`);
    irisG.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = irisG;
    ctx.beginPath(); ctx.arc(cx, cy, irisR, 0, TAU); ctx.fill();
    ctx.fillStyle = `hsla(${irisHue}, 65%, 20%, 0.92)`;
  }
  ctx.beginPath(); ctx.arc(cx, cy, pR * 0.7, 0, TAU); ctx.fill();

  // ── Waveform spine — right edge ─────────────────────────────────────────────
  if (listening && energy > 0.04) {
    ctx.globalCompositeOperation = isRainbow ? 'multiply' : 'screen';
    const rimX = cx + R_scale * 0.92;
    for (let i = 0; i < 64; i++) {
      const wy   = cy - R_scale + (i / 64) * R_scale * 2;
      const woff = waveform[i] * 22 * (1 + energy * 2.5);
      const wa   = 0.12 + energy * 0.4;
      // Rainbow: dark marks on white; others: bright on dark
      const wHue = isRainbow
        ? (((i / 64 * 360 + cym.rot * 60 / Math.PI) % 360) + 360) % 360
        : F.rimHue;
      const wLight = isRainbow ? 30 : 68;
      ctx.fillStyle = `hsla(${wHue}, 80%, ${wLight}%, ${wa})`;
      ctx.fillRect(rimX + woff - 1, wy, 2, R_scale * 2 / 64 + 1);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ── Mode label ───────────────────────────────────────────────────────────────
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.font      = `${Math.round(W * 0.011)}px Orbitron, monospace`;
  ctx.fillStyle = `rgba(${F.glow[0]|0},${F.glow[1]|0},${F.glow[2]|0},0.16)`;
  ctx.textAlign = 'right';
  ctx.fillText(F.name, W - W*0.022, H - H*0.038);
  ctx.restore();
}

// ── UI auto-hide ──────────────────────────────────────────────────────────────
const uiEl  = document.getElementById('ui');
const lblEl = document.getElementById('mode-label');
let hideTimer = null;

function showUI() {
  uiEl.classList.remove('hidden');
  lblEl.classList.remove('hidden');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    uiEl.classList.add('hidden');
    lblEl.classList.add('hidden');
  }, 3500);
}

['mousemove','keydown','click','touchstart'].forEach(ev =>
  window.addEventListener(ev, showUI, { passive: true })
);
showUI();

// Keyboard shortcuts: 1-5 = filter, M = mic
window.addEventListener('keydown', e => {
  const FKEYS = ['bio','forge','void','plasma','raw','rainbow'];
  const map   = { '1':'bio','2':'forge','3':'void','4':'plasma','5':'raw','6':'rainbow' };
  const k     = map[e.key];
  if (k) { const btns = uiEl.querySelectorAll('.btn:not(#mic-btn)');
           setFilter(k, btns[FKEYS.indexOf(k)]); return; }
  if (e.key.toLowerCase() === 'm') toggleMic();
});

// ── Loop ──────────────────────────────────────────────────────────────────────
let lastNow = null;

function loop(now) {
  if (!lastNow) lastNow = now;
  const dt = Math.min(now - lastNow, 64);  // cap at 64ms to prevent spiral on tab-wake
  lastNow  = now;

  analyzeAudio();
  updateCym(dt);       // cym params + filter clock
  updateRings(dt);     // persistent ring positions + weights
  updateRipples();
  render(now, dt);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
