.entry.fading{opacity:0!important;}
.entry-time{font-size:8px;letter-spacing:0.3em;color:rgba(140,180,220,0.2);min-width:42px;flex-shrink:0;}

.entry.big .entry-text{font-size:clamp(15px,2.6vw,34px);letter-spacing:0.15em;font-weight:700;}
.entry.G .entry-text{font-size:clamp(22px,4vw,58px);letter-spacing:0.26em;font-weight:900;}

#current-text{font-size:clamp(13px,1.9vw,25px);letter-spacing:0.16em;text-transform:uppercase;font-weight:700;opacity:0;transition:opacity 0.5s ease;}
#phrase-role{font-size:8px;letter-spacing:0.35em;color:rgba(140,180,220,0.3);text-transform:uppercase;opacity:0;transition:opacity 0.4s ease;}
#controls{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.btn{background:rgba(20,28,40,0.8);border:1px solid rgba(100,160,200,0.15);color:rgba(160,200,230,0.5);padding:7px 18px;font-size:8px;letter-spacing:0.35em;text-transform:uppercase;cursor:pointer;font-family:'Orbitron',monospace;transition:all 0.2s;}
.btn:hover,.btn.active{background:rgba(0,100,180,0.2);border-color:rgba(100,180,255,0.4);color:rgba(200,230,255,0.9);}
#note-ghost{position:fixed;right:24px;top:50%;transform:translateY(-50%);font-size:clamp(80px,13vw,170px);font-weight:900;opacity:0.04;pointer-events:none;z-index:1;transition:opacity 2.5s ease,color 1.2s ease;}
#status-line{font-size:8px;letter-spacing:0.28em;color:rgba(140,180,220,0.22);text-transform:uppercase;margin-left:14px;}
#spine-bar{position:fixed;left:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:11;}
.spine-node{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);transition:all 0.6s ease;}
#spine-momentum{font-size:8px;letter-spacing:0.2em;color:rgba(140,180,220,0.2);text-transform:uppercase;margin-top:8px;writing-mode:vertical-rl;}
#tension-meter{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:200px;height:2px;background:rgba(255,255,255,0.05);z-index:11;}

// ══════════════════════════════════════════════════════════
// THE JAZZ MIND
//
// Phrase roles: CALL | DEVELOPMENT | CONTRAST | RESOLUTION
//
// CALL        — opens a phrase. Establishes the register.
//               Fires when: tension is low, phrase is fresh.
//               Grammar: medium complexity, open resolution.
//
// DEVELOPMENT — deepens the call. Same register or rising.
//               Fires when: tension is building, spine is moving.
//               Grammar: higher complexity, lower resolution.
//
// CONTRAST    — breaks the pattern. Different register from call.
//               Fires when: tension > 0.6, spine held too long.
//               Grammar: opposite weight class from previous.
//               This is the blue note. The unexpected chord.
//
// RESOLUTION  — closes the phrase. Returns or releases.
//               Fires when: tension > 0.75, or after contrast.
//               Grammar: lower complexity, high resolution.
//               After resolution, tension resets.
//
// Rhythmic feel:
//   After CALL:        medium wait (the room breathes)
//   After DEVELOPMENT: shorter wait (momentum carries)
//   After CONTRAST:    longer wait (the surprise needs space)
//   After RESOLUTION:  longest wait (the phrase is complete)
// ══════════════════════════════════════════════════════════

const jazz = {
  // Phrase state
  role: 'CALL',           // current phrase role
  phraseCount: 0,         // total phrases completed
  phraseLength: 0,        // utterances in current phrase
  tension: 0.0,           // accumulated tension 0→1
  lastResolutionFrame: 0, // when we last resolved

  // Phrase memory — last 4 utterances
  memory: [],             // [{note, role, rs, complexity, frame}]

  // Mode — which register the chronicle is currently dwelling in
  // If it stays too long, contrast is forced
  modeNote: 'B',
  modeFrames: 0,
  MODE_LIMIT: 800,        // frames before contrast is forced

  // Rhythmic spacing — felt, not metered
  // Each role has a base wait multiplier
  waitMultiplier: 1.0,
};

// Resolution score of a note — how much it closes things
function noteResolution(note){
  return COSMOLOGY[note] ? (COSMOLOGY[note].rs ? COSMOLOGY[note].rs[0]*0.5+COSMOLOGY[note].rs[1]*0.5 : 0.5) : 0.5;
}

// Tension contribution of an utterance
function tensionOf(note, role){
  const rs = noteResolution(note);
  // Low resolution = more tension. Development adds. Resolution subtracts.
  const base = 1.0 - rs;
  if(role==='DEVELOPMENT') return base * 0.35;
  if(role==='CONTRAST')    return base * 0.2;  // contrast releases some tension
  if(role==='RESOLUTION')  return -0.45;        // strong release
  return base * 0.2; // CALL
}

// Determine next phrase role from jazz state + spine
function nextRole(spinePos, remainder, forceContrast){
  const t = jazz.tension;
  const mem = jazz.memory;
  const lastNote = mem.length>0 ? mem[mem.length-1].note : null;
  const lastRole = mem.length>0 ? mem[mem.length-1].role : 'RESOLUTION';

  // Force contrast if mode has been held too long
  if(forceContrast || jazz.modeFrames > jazz.MODE_LIMIT) return 'CONTRAST';

  // After resolution — start fresh with a call
  if(lastRole==='RESOLUTION') return 'CALL';

  // After contrast — resolve
  if(lastRole==='CONTRAST') return 'RESOLUTION';

  // High tension — resolve
  if(t > 0.78) return 'RESOLUTION';

  // Building tension — develop or contrast
  if(t > 0.5){
    // If spine has been ascending — keep developing
    if(spinePos > (lastNote ? COSMOLOGY[lastNote].idx : 2)) return 'DEVELOPMENT';
    return 'CONTRAST';
  }

  // Low-medium tension — develop the call
  if(lastRole==='CALL') return 'DEVELOPMENT';
  if(lastRole==='DEVELOPMENT' && jazz.phraseLength < 3) return 'DEVELOPMENT';
  if(jazz.phraseLength >= 3) return 'RESOLUTION';

  return 'DEVELOPMENT';
}

// Modify voice selection based on phrase role
function applyJazzIntent(voice, role, spinePos){
  if(!voice) return voice;
  const mem = jazz.memory;

  if(role==='CONTRAST'){
    // Find the opposite register from recent memory
    if(mem.length>0){
      const recent=mem[mem.length-1].note;
      const recentIdx=COSMOLOGY[recent].idx;
      // Contrast = jump at least 2 notes in opposite direction
      const contrastIdx = recentIdx > 3
        ? Math.max(0, recentIdx-3)
        : Math.min(6, recentIdx+3);
      voice.note = NOTE_ORDER[Math.round(contrastIdx)];
      voice.big = false;
    }
  }

  if(role==='RESOLUTION'){
    // Resolution prefers notes with high rs, lower than current tension
    // Nudge toward A or C depending on where we are
    const resolveIdx = spinePos > 4 ? 2 : spinePos > 2 ? 1 : 0;
    // Only resolve downward if spine momentum is descending
    // Otherwise resolve in place
    if(jazz.tension > 0.6){
      voice.note = NOTE_ORDER[resolveIdx];
      voice.big = false;
    }
  }

  return voice;
}

// Rhythmic wait — felt spacing between utterances
function rhythmicWait(role){
  const base = 240;
  const multipliers = {
    CALL:        1.2,
    DEVELOPMENT: 0.75,  // shorter — momentum carries
    CONTRAST:    1.8,   // longer — surprise needs space
    RESOLUTION:  2.2,   // longest — phrase complete
  };
  return Math.floor(base * (multipliers[role]||1.0));
}

// ── SUBTRACTIVE GRAMMAR ENGINE ───────────────────────────
function computePhonemeConstraints(remainder, spinePos){
  if(!remainder.length) return null;
  let wtMin=0,wtMax=1,tpMin=0,tpMax=1,rsMin=0,rsMax=1;
  remainder.forEach(n=>{
    const c=COSMOLOGY[n];
    wtMin=Math.max(wtMin,c.wt[0]); wtMax=Math.min(wtMax,c.wt[1]);
    tpMin=Math.max(tpMin,c.tp[0]); tpMax=Math.min(tpMax,c.tp[1]);
    rsMin=Math.max(rsMin,c.rs[0]); rsMax=Math.min(rsMax,c.rs[1]);
  });
  const sc=COSMOLOGY[NOTE_ORDER[Math.round(Math.min(6,Math.max(0,spinePos)))]];
  if(wtMin>wtMax){wtMin=sc.wt[0];wtMax=sc.wt[1];}
  if(tpMin>tpMax){tpMin=sc.tp[0];tpMax=sc.tp[1];}
  if(rsMin>rsMax){rsMin=sc.rs[0];rsMax=sc.rs[1];}
  return {wt:[wtMin,wtMax],tp:[tpMin,tpMax],rs:[rsMin,rsMax]};
}

// Resolution-biased constraints for RESOLUTION role
function biasConstraintsForRole(constraints, role){
  if(!constraints) return constraints;
  if(role==='RESOLUTION'){
    return {...constraints, rs:[Math.max(constraints.rs[0],0.5),1.0]};
  }
  if(role==='DEVELOPMENT'){
    return {...constraints, rs:[0.0,Math.min(constraints.rs[1],0.5)]};
  }
  return constraints;
}

function filterWords(pool,constraints,fallback){
  if(!constraints) return pool;
  const f=pool.filter(w=>w.wt>=constraints.wt[0]&&w.wt<=constraints.wt[1]&&w.tp>=constraints.tp[0]&&w.tp<=constraints.tp[1]&&w.rs>=constraints.rs[0]&&w.rs<=constraints.rs[1]);
  return f.length>0?f:(fallback||pool);
}

function pickWord(pool){return pool[Math.floor(Math.random()*pool.length)].w;}

function maxComplexityFromMomentum(momentum, role){
  const abs=Math.abs(momentum);
  let max=6;
  if(abs>0.15) max=1;
  else if(abs>0.08) max=3;
  // Resolution always stays simple
  if(role==='RESOLUTION') max=Math.min(max,2);
  if(role==='CONTRAST')   max=Math.min(max,2);
  return max;
}

function compose(voiceNote, remainder, spinePos, momentum, role){
  const cosmo=COSMOLOGY[voiceNote];
  let structs=STRUCTURES.filter(s=>s.notes.includes(voiceNote));
  const maxC=Math.min(cosmo.maxComplexity,maxComplexityFromMomentum(momentum,role));
  structs=structs.filter(s=>s.complexity<=maxC);
  if(!structs.length){
    const soloPool=WORD_FIELD.solo.filter(w=>w.note===voiceNote||w.note==='A');
    return soloPool.length?pickWord(soloPool):'—';
  }
  let constraints=computePhonemeConstraints(remainder,spinePos);
  constraints=biasConstraintsForRole(constraints,role);
  const struct=structs[Math.floor(Math.pow(Math.random(),1.4)*structs.length)];
  const parts=struct.slots.map(slot=>{
    switch(slot){
      case 'SOLO':{const p=WORD_FIELD.solo.filter(w=>w.note===voiceNote||w.note==='A');return pickWord(filterWords(p,constraints,p));}
      case 'S':   return pickWord(filterWords(WORD_FIELD.subjects,   constraints,WORD_FIELD.subjects));
      case 'Vi':  return pickWord(filterWords(WORD_FIELD.verbs_i,    constraints,WORD_FIELD.verbs_i));
      case 'Vt':  return pickWord(filterWords(WORD_FIELD.verbs_t,    constraints,WORD_FIELD.verbs_t));
      case 'O':   return pickWord(filterWords(WORD_FIELD.objects,    constraints,WORD_FIELD.objects));
      case 'Adv': return pickWord(filterWords(WORD_FIELD.adverbials, constraints,WORD_FIELD.adverbials));
      case 'Sub': return pickWord(filterWords(WORD_FIELD.subordinates,constraints,WORD_FIELD.subordinates));
      default: return '';
    }
  });
  return parts.filter(Boolean).join(' ');
}

// ── AUDIO ────────────────────────────────────────────────
const canvas=document.getElementById('bg-canvas');
const ctx=canvas.getContext('2d');
let W,H;
let audioCtx,analyser,micStream,freqData,timeData;
let listening=false,energy=0;
let waveform=new Float32Array(128);
let animFrame=0,sessionStart=Date.now();

const BANDS={
  sub:    {lo:0,  hi:3,  val:0},bass:   {lo:3,  hi:10, val:0},
  lowmid: {lo:10, hi:25, val:0},mid:    {lo:25, hi:60, val:0},
  highmid:{lo:60, hi:100,val:0},high:   {lo:100,hi:150,val:0},
  air:    {lo:150,hi:255,val:0},
};

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

async function startMic(){
  if(listening) return;
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=512;analyser.smoothingTimeConstant=0.70;
    const src=audioCtx.createMediaStreamSource(micStream);
    src.connect(analyser);
    freqData=new Uint8Array(analyser.frequencyBinCount);
    timeData=new Uint8Array(analyser.frequencyBinCount);
    listening=true;
    document.getElementById('mic-btn').classList.add('active');
    document.getElementById('mic-btn').textContent='● listening';
  }catch(e){document.getElementById('mic-btn').textContent='mic unavailable';}
}

function analyzeAudio(){
  if(!listening||!analyser) return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  Object.entries(BANDS).forEach(([,band])=>{
    let sum=0;for(let i=band.lo;i<band.hi;i++) sum+=freqData[i];
    band.val=band.val*0.76+((sum/((band.hi-band.lo)*255))*0.24);
  });
  for(let i=0;i<128;i++) waveform[i]=waveform[i]*0.65+((timeData[i*2]-128)/128)*0.35;
  energy=(BANDS.bass.val+BANDS.mid.val+BANDS.high.val)/3;
}

// ── SPINE ────────────────────────────────────────────────
const spine={pos:1.0,momentum:0.0,peakPos:1.0,gTouched:false,gFloor:0.0,breathPhase:0.0};
function updateSpine(centroid,hasSignal){
  spine.breathPhase+=0.008;
  if(!hasSignal){
    spine.momentum*=0.88;
    spine.pos=Math.max(Math.max(0.3+spine.gFloor,spine.pos*0.997)+spine.momentum*0.3,0);
    spine.pos=Math.min(6.0,spine.pos);return;
  }
  const pull=centroid-spine.pos;
  spine.momentum+=pull*(pull>0?0.055:0.028);
  spine.momentum*=0.82;
  spine.pos+=spine.momentum+Math.sin(spine.breathPhase)*0.015;
  spine.pos=Math.max(Math.max(0.3+spine.gFloor,0),Math.min(6.0,spine.pos));
  if(spine.pos>spine.peakPos) spine.peakPos=spine.pos;
  if(spine.pos>=5.8&&!spine.gTouched){spine.gTouched=true;spine.gFloor=0.4;}
}
function spineNote(){return NOTE_ORDER[Math.round(Math.min(6,Math.max(0,spine.pos)))];}
function signalNote(c){return NOTE_ORDER[Math.round(Math.min(6,Math.max(0,c)))];}
function momentumLabel(){
  if(spine.momentum>0.04) return '↑ ascending';
  if(spine.momentum<-0.04) return '↓ descending';
  return '· holding';
}

function selectVoice(remainder){
  if(!remainder.length) return null;
  const sNote=spineNote(),sIdx=COSMOLOGY[sNote].idx;
  const centroid=remainder.reduce((s,n)=>s+COSMOLOGY[n].idx,0)/remainder.length;
  const sigNote=signalNote(centroid),sigIdx=COSMOLOGY[sigNote].idx;
  if(remainder.includes('G')&&spine.pos>=5.5) return {note:'G',big:true,pair:null};
  if(sNote===sigNote) return {note:sNote,big:spine.momentum>0.08,pair:null};
  if(sigIdx>sIdx) return {note:sigNote,big:false,pair:[sNote,sigNote]};
  if(sigIdx<sIdx&&spine.momentum>-0.05) return {note:sNote,big:false,pair:null};
  return {note:sigNote,big:false,pair:[sigNote,sNote]};
}

// ── NAND MESH ────────────────────────────────────────────
const noteThreshBoost={A:0,B:0,C:0,D:0,E:0,F:0,G:0};
let meshRotation=0,nandCycle=0;
function getAdaptiveThresh(){
  const vals=NOTE_ORDER.map(n=>BANDS[NOTE_TO_BAND[n]].val);
  const mean=vals.reduce((a,b)=>a+b,0)/N;
  return Math.max(mean+(Math.max(...vals)-mean)*0.28,0.016);
}
function quantize(){
  const base=getAdaptiveThresh(),s={};
  NOTE_ORDER.forEach(n=>{s[n]=BANDS[NOTE_TO_BAND[n]].val>=(base+(noteThreshBoost[n]||0))?1:0;});
  return s;
}
function nandPass(state,rotation){
  const res={};
  NOTE_ORDER.forEach((note,i)=>{
    const partner=NOTE_ORDER[(i+(rotation%2===0?3:4))%N];
    res[note]=state[note]&(!(state[note]===1&&state[partner]===1)?1:0);
  });
  return res;
}
function runNandMesh(state){
  let s=nandPass({...state},meshRotation);
  s=nandPass(s,meshRotation+1);
  const s3={};
  NOTE_ORDER.forEach((note,i)=>{
    const a=NOTE_ORDER[(i+2)%N],b=NOTE_ORDER[(i+N-2)%N];
    s3[note]=(s[a]===1||s[b]===1)&&s[note]===1?0:s[note];
  });
  return s3;
}
function getRemainder(m){return NOTE_ORDER.filter(n=>m[n]===1);}

let remainderBuffer=[];
function checkStability(rem){
  const key=rem.join('');
  remainderBuffer.push(key);
  if(remainderBuffer.length>28) remainderBuffer.shift();
  return remainderBuffer.length>=28&&remainderBuffer.every(r=>r===key);
}

// ── CHRONICLE ────────────────────────────────────────────
let entries=[],totalObs=0;
let currentLocked=false,currentTimer=null;
let lastSpeakFrame=-400,currentWait=240;
let silenceFrames=0,silenceSpoken=false;
const recentSpeaks=[];
let lastText='';

function applyClimbPressure(note){
  recentSpeaks.push(note);if(recentSpeaks.length>5) recentSpeaks.shift();
  NOTE_ORDER.forEach(n=>{noteThreshBoost[n]=Math.max(0,(noteThreshBoost[n]||0)*0.93);});
  if(recentSpeaks.filter(n=>n===note).length>=3) noteThreshBoost[note]=(noteThreshBoost[note]||0)+0.016;
}

function updateJazzState(note, role, text){
  // Update tension
  jazz.tension=Math.max(0,Math.min(1,jazz.tension+tensionOf(note,role)));
  if(role==='RESOLUTION'){jazz.tension*=0.3;jazz.phraseCount++;jazz.phraseLength=0;jazz.lastResolutionFrame=animFrame;}
  else jazz.phraseLength++;

  // Mode tracking
  if(note===jazz.modeNote) jazz.modeFrames+=currentWait;
  else{jazz.modeNote=note;jazz.modeFrames=0;}

  // Push to phrase memory
  jazz.memory.push({note,role,rs:noteResolution(note),frame:animFrame,text});
  if(jazz.memory.length>4) jazz.memory.shift();

  // Update tension meter
  document.getElementById('tension-fill').style.width=(jazz.tension*100)+'%';
  document.getElementById('phrase-count').textContent=jazz.phraseCount;
}

function updateSpineVisual(){
  NOTE_ORDER.forEach((n,i)=>{
    const node=document.getElementById(`sn-${n}`);if(!node) return;
    const dist=Math.abs(i-spine.pos),c=COSMOLOGY[n].color;
    if(dist<0.8) node.style.cssText=`width:8px;height:8px;border-radius:50%;border:1px solid ${c};background:${c};box-shadow:0 0 10px ${c}99;transform:scale(1.5);opacity:1;transition:all 0.6s ease;`;
    else if(dist<1.6) node.style.cssText=`width:8px;height:8px;border-radius:50%;border:1px solid ${c}66;background:transparent;box-shadow:0 0 4px ${c}44;transform:scale(1.1);opacity:0.5;transition:all 0.6s ease;`;
    else node.style.cssText=`width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.08);background:transparent;transform:scale(1);opacity:0.2;transition:all 0.6s ease;`;
  });
  document.getElementById('spine-momentum').textContent=momentumLabel();
}

function think(){
  if(!listening) return;
  const state=quantize();
  const meshOut=runNandMesh(state);
  const remainder=getRemainder(meshOut);
  nandCycle++;meshRotation=(meshRotation+1)%N;
  NOTE_ORDER.forEach(n=>{noteThreshBoost[n]=Math.max(0,(noteThreshBoost[n]||0)*0.997);});
  const hasSignal=remainder.length>0&&energy>0.012;
  const centroid=hasSignal?remainder.reduce((s,n)=>s+COSMOLOGY[n].idx,0)/remainder.length:spine.pos*0.97;
  updateSpine(centroid,hasSignal);
  updateSpineVisual();
  if(energy<0.010) silenceFrames++;
  else{silenceFrames=0;silenceSpoken=false;}
  const inp=NOTE_ORDER.map(n=>state[n]?n:'·').join('');
  const out=NOTE_ORDER.map(n=>meshOut[n]?n:'·').join('');
  const rem=remainder.length>0?remainder.join(''):'∅';
  document.getElementById('nand-display').textContent=
    `IN [${inp}] → [${out}] REM ${rem}\nSPINE ${spine.pos.toFixed(2)} ${momentumLabel()} T:${jazz.tension.toFixed(2)} ${jazz.role}`;
  const nc=document.getElementById('nand-cycle'); if(nc) nc.textContent=nandCycle;
  if(currentLocked) return;
  if(animFrame-lastSpeakFrame<currentWait) return;
  if(silenceFrames>300&&!silenceSpoken){
    const sn=spineNote();
    const role='RESOLUTION';
    const text=compose(sn,[],spine.pos,0,role);
    if(text) speak(text,sn,false,null,role);
    silenceSpoken=true;return;
  }
  if(!checkStability(remainder)||!remainder.length) return;
  remainderBuffer=[];
  let voice=selectVoice(remainder);
  if(!voice) return;

  // Jazz mind — determine role and modify voice
  const forceContrast=jazz.modeFrames>jazz.MODE_LIMIT;
  const role=nextRole(spine.pos,remainder,forceContrast);
  jazz.role=role;
  voice=applyJazzIntent(voice,role,spine.pos);

  // Set rhythmic wait for next utterance
  currentWait=rhythmicWait(role);

  let text=compose(voice.note,remainder,spine.pos,spine.momentum,role);
  if(text===lastText) text=compose(voice.note,remainder,spine.pos,spine.momentum,role);
  if(!text||!text.trim()) return;
  lastText=text;
  speak(text,voice.note,voice.big,voice.pair||null,role);
}

function speak(text,note,big,pair,role){
  if(!text||currentLocked) return;
  currentLocked=true;lastSpeakFrame=animFrame;
  applyClimbPressure(note);
  updateJazzState(note,role||'CALL',text);
  const cosmo=COSMOLOGY[note],color=cosmo?cosmo.color:'#fff';
  const el=document.getElementById('current-text');
  el.style.color=color;
  el.style.textShadow=`0 0 36px ${color}55`;
  el.style.fontSize=note==='G'?'clamp(28px,5vw,70px)':big?'clamp(16px,3vw,42px)':'clamp(11px,1.5vw,19px)';
  el.textContent=text.toUpperCase();
  el.style.opacity='1';
  const pr=document.getElementById('phrase-role');
  pr.textContent=role||'';
  pr.style.color=color;
  pr.style.opacity='1';
  const ng=document.getElementById('note-ghost');
  ng.textContent=pair?pair.join(''):note;
  ng.style.color=color;
  ng.style.opacity=note==='G'?'0.13':'0.05';
  document.getElementById('status-line').textContent=pair
    ?`${COSMOLOGY[pair[0]].world.toUpperCase()} ⟷ ${COSMOLOGY[pair[1]].world.toUpperCase()}`
    :cosmo?`${note} · ${cosmo.world.toUpperCase()} · ${cosmo.register.toUpperCase()}`:'—';
  clearTimeout(currentTimer);
  const hold=note==='G'?6500:big?3800:2400;
  currentTimer=setTimeout(()=>{
    el.style.opacity='0';pr.style.opacity='0';
    ng.style.opacity='0.03';
    setTimeout(()=>{currentLocked=false;addEntry(text,note,big,pair,role);},600);
  },hold);
}

function addEntry(text,note,big,pair,role){
  if(!text||!text.trim()) return;
  const el=document.createElement('div');
  el.className=`entry${big?' big':''} ${note}`;
  const e=Math.floor((Date.now()-sessionStart)/1000);
  const mm=String(Math.floor(e/60)).padStart(2,'0'),ss=String(e%60).padStart(2,'0');
  const c=COSMOLOGY[note]?COSMOLOGY[note].color:'#fff';
  const nl=pair?pair.join('⟷'):note;
  el.innerHTML=`<span class="entry-time">${mm}:${ss}</span><span class="entry-note" style="color:${c}">${nl}</span><span class="entry-role">${role||''}</span><span class="entry-text" style="color:${c};text-shadow:0 0 ${big?20:7}px ${c}30">${text.toUpperCase()}</span>`;
  el.style.opacity='0';
  document.getElementById('chronicle').appendChild(el);
  requestAnimationFrame(()=>{el.style.transition='opacity 0.7s ease';el.style.opacity='1';});
  entries.push({el,note,frame:animFrame});
  while(entries.length>16){const old=entries.shift();old.el.classList.add('fading');setTimeout(()=>old.el.remove(),1600);}
  totalObs++;
  document.getElementById('obs-count').textContent=totalObs;
}

function clearChronicle(){entries.forEach(e=>e.el.remove());entries=[];}

function drawBackground(){
  ctx.clearRect(0,0,W,H);
  const note=spineNote(),cosmo=COSMOLOGY[note],brightness=spine.pos/6.0;
  // Tension shifts the background — higher tension = more saturated
  const tintAlpha=(energy+brightness*0.04)*0.18*(1+jazz.tension*0.5);
  if(cosmo&&energy>0.008){
    const r=W*0.4+brightness*W*0.2;
    const grd=ctx.createRadialGradient(W*0.5,H*(0.6-brightness*0.2),0,W*0.5,H*0.5,r);
    grd.addColorStop(0,hexToRgba(cosmo.color,tintAlpha));
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  }
  if(listening){
    ctx.save();ctx.globalAlpha=0.18+energy*0.28;ctx.beginPath();
    for(let i=0;i<128;i++){const y=(i/128)*H,x=W*0.072+waveform[i]*W*0.03*(1+energy*2);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.strokeStyle=cosmo?cosmo.color:'#19b7a8';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  }
  if(listening){
    ctx.save();const base=getAdaptiveThresh();
    NOTE_ORDER.forEach((n,i)=>{
      const band=BANDS[NOTE_TO_BAND[n]],present=band.val>=(base+(noteThreshBoost[n]||0));
      const bh=H/N,bw=band.val*W*0.06;
      ctx.globalAlpha=present?0.28:0.05;ctx.fillStyle=COSMOLOGY[n].color;
      ctx.fillRect(W-bw-12,i*bh+3,bw,bh-6);
      ctx.globalAlpha=present?0.32:0.08;
      ctx.font=`700 ${Math.round(bh*0.3)}px Orbitron,monospace`;
      ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle=COSMOLOGY[n].color;
      ctx.fillText(n,W-14,i*bh+bh*0.5);
    });
    ctx.restore();
  }
}

function hexToRgba(hex,alpha){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

setInterval(()=>{
  const e=Math.floor((Date.now()-sessionStart)/1000);
  document.getElementById('timer').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
},1000);

function loop(){analyzeAudio();think();drawBackground();animFrame++;requestAnimationFrame(loop);}
loop();
</script>
</body>
