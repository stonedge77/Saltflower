// ─────────────────────────────────────────────────────────
// NAND REMAINDER ENGINE
// Input: spine (array of visited node seeds + user NAND stars)
// Output: a narration string that is NOT any single node's seed
//         but is the residue of their interference
// ─────────────────────────────────────────────────────────
function computeNAND(spine, nextNode) {
  // Gather all seed phrases from spine nodes
  const spineSeeds = [];
  spine.forEach(s => {
    if (s.type === 'node' && s.nodeRef) {
      s.nodeRef.seeds.forEach(sd => spineSeeds.push({text:sd, col:s.nodeRef.col, name:s.nodeRef.name}));
    }
    if (s.type === 'nand') {
      // User star: treat as a seed vector injected into the field
      spineSeeds.push({text:s.name, col:[180,140,240], name:'⊕'});
    }
  });

  const nextSeeds = nextNode.seeds;

  // If spine is empty, return the first seed of the next node transformed
  if (spineSeeds.length === 0) {
    return xformSeed(nextSeeds[0], nextNode.name);
  }

  // T = A ⊕ B ⊕ NAND(A,B)
  // We simulate this over the semantic space of seed phrases:
  // A = accumulated spine field (pick the most "distant" seed from next node)
  // B = next node's seed (pick the one least covered by spine)
  // NAND(A,B) = what A and B cannot both assert — the gap phrase
  // T = the remainder: language that belongs to neither cleanly

  // 1. Score spine seeds vs next node seeds for overlap (word intersection)
  const nextWords = new Set(nextSeeds.join(' ').toLowerCase().split(/\W+/).filter(w=>w.length>3));

  let bestSpineSeed = spineSeeds[0];
  let maxDist = 0;
  spineSeeds.forEach(s => {
    const sw = new Set(s.text.toLowerCase().split(/\W+/).filter(w=>w.length>3));
    let overlap = 0;
    sw.forEach(w=>{ if(nextWords.has(w)) overlap++; });
    const dist = sw.size - overlap;
    if(dist > maxDist){ maxDist = dist; bestSpineSeed = s; }
  });

  // 2. Pick next seed least overlapping with the spine as a whole
  const spineAllWords = new Set(spineSeeds.map(s=>s.text).join(' ').toLowerCase().split(/\W+/).filter(w=>w.length>3));
  let bestNextSeed = nextSeeds[0];
  let minOverlap = Infinity;
  nextSeeds.forEach(sd => {
    const sw = new Set(sd.toLowerCase().split(/\W+/).filter(w=>w.length>3));
    let overlap = 0;
    sw.forEach(w=>{ if(spineAllWords.has(w)) overlap++; });
    if(overlap < minOverlap){ minOverlap=overlap; bestNextSeed=sd; }
  });

  // 3. Extract the NAND residue: words in A not in B, words in B not in A
  const aw = bestSpineSeed.text.toLowerCase().split(/\W+/).filter(w=>w.length>3);
  const bw = bestNextSeed.toLowerCase().split(/\W+/).filter(w=>w.length>3);
  const bSet = new Set(bw);
  const aSet = new Set(aw);
  const aOnly = aw.filter(w=>!bSet.has(w));
  const bOnly = bw.filter(w=>!aSet.has(w));

  // 4. Also carry any user NAND stars as explicit modifiers
  const nandStars = spine.filter(s=>s.type==='nand').map(s=>s.name);

  // 5. Build the 3rd oscillation narration from the residue
  return buildNarration(bestSpineSeed, bestNextSeed, aOnly, bOnly, nandStars, spine, nextNode);
}

function buildNarration(spineEntry, nextSeed, aOnly, bOnly, stars, spine, nextNode) {
  // The narration describes the INTERFERENCE PATH, not either node.
  // It uses: the spine trail name-chain, the residue words, any user stars,
  // and a traversal connector chosen by spine length.

  const spineNames = spine.filter(s=>s.type==='node').map(s=>s.name);
  const depth = spineNames.length;

  // Traversal connectors — vary with depth to avoid monotony
  const connectors = [
    'passes through', 'threads across', 'leaves a residue in',
    'cannot be contained by', 'subtracts from', 'phase-locks against',
    'exhales into', 'resonates past', 'dissolves at the boundary of'
  ];
  const conn = connectors[depth % connectors.length];

  // Residue phrase construction
  const residueA = aOnly.slice(0,3).join(' · ');
  const residueB = bOnly.slice(0,3).join(' · ');

  // Star modifier
  let starMod = '';
  if(stars.length>0){
    const star = stars[stars.length-1];
    starMod = ` The star "${star}" bends this toward what neither field names.`;
  }

  // Spine trail summary
  let trail = '';
  if(spineNames.length>=2){
    trail = spineNames.slice(-3).join(' → ') + ' → ' + nextNode.name;
  } else if(spineNames.length===1){
    trail = spineNames[0] + ' → ' + nextNode.name;
  }

  // Assemble: narrate the path, not the destination
  const lines = [];

  if(trail){
    lines.push(`The spine [ ${trail} ] ${conn} the gap where neither holds.`);
  }

  if(residueA && residueB){
    lines.push(`What the path carries forward: ${residueA} — against — ${residueB}.`);
  } else if(residueA){
    lines.push(`The spine presses: ${residueA}.`);
  } else if(residueB){
    lines.push(`The next field opens: ${residueB}.`);
  }

  // T=1 remainder line — always present
  const remainderLine = getRemainder(spineEntry.text, nextSeed, depth);
  lines.push(remainderLine);

  if(starMod) lines.push(starMod);

  return lines.join(' ');
}

function getRemainder(a, b, depth) {
  // Produces a short T=1 statement — the irreducible bit that neither A nor B owns
  // Varies by depth to prevent repetition
  const templates = [
    `T=1: what neither phrase erases survives as the signal.`,
    `The remainder is not noise — it is parity across the path.`,
    `Neither end of the spine can account for what the crossing produces.`,
    `The breath does not return to zero. The unpaired bit recirculates.`,
    `What the NAND gate outputs is not a synthesis — it is an exclusion with something left over.`,
    `The gap between these phases is the only thing the traversal actually generates.`,
    `Information exceeds time. The spine holds what each reset forgets.`,
  ];
  return templates[depth % templates.length];
}

function xformSeed(seed, name) {
  // First node in spine — lightly transform the seed rather than return it raw
  return `${name} opens: ${seed}. The spine has not yet formed — this is the inhale before the first hold.`;
}

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H,CX,CY,R;
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  CX=W/2; CY=H/2-68;
  R=Math.min(W,H)*0.37;
  buildNodes();
}
window.addEventListener('resize',resize);

const RINGS=[0.28,0.60,1.0];
let nodes=[];
function buildNodes(){
  nodes=nodeData.map((d,i)=>{
    const angle=d.a*Math.PI*2-Math.PI/2;
    const r=R*RINGS[d.ring];
    return{...d,i,x:CX+Math.cos(angle)*r,y:CY+Math.sin(angle)*r,
      angle,r,pulse:Math.random()*Math.PI*2,
      pulseSpeed:.007+Math.random()*.011,
      baseSize:d.ring===0?7:d.ring===1?5.5:4.5,
      lit:0,litDecay:.009};
  });
}

// ─────────────────────────────────────────────────────────
// SPINE STATE
// ─────────────────────────────────────────────────────────
let spine=[];
const MAX_VIS=10;

function renderSpine(){
  const bar=document.getElementById('spine-bar');
  bar.innerHTML='';
  const vis=spine.length>MAX_VIS?spine.slice(-MAX_VIS):spine;
  const hidden=spine.length-vis.length;
  if(hidden>0){
    const ov=document.createElement('span');
    ov.className='spine-more';
    ov.textContent=`+${hidden}…`;
    bar.appendChild(ov);
  }
  vis.forEach((s,i)=>{
    if(i>0){
      const arr=document.createElement('span');
      arr.className='spine-arr';
      arr.textContent=s.type==='nand'?'⊕':'→';
      bar.appendChild(arr);
    }
    const crumb=document.createElement('div');
    crumb.className='spine-crumb';
    const el=document.createElement('span');
    el.className='spine-node'+(s.type==='nand'?' is-nand':'');
    const [cr,cg,cb]=s.col||[200,180,120];
    el.style.color=`rgb(${cr},${cg},${cb})`;
    el.style.borderColor=`rgba(${cr},${cg},${cb},${s.type==='nand'?.45:.22})`;
    el.textContent=s.type==='nand'?`⊕ ${s.name}`:s.name;
    if(s.type==='node'){
      el.addEventListener('click',()=>{
        const nd=nodes.find(n=>n.name===s.name);
        if(nd) visitNode(nd,true);
      });
    }
    crumb.appendChild(el);
    bar.appendChild(crumb);
  });
}

// AUDIO
// ─────────────────────────────────────────────────────────
let audioCtx=null,analyser=null,dataArr=null,micActive=false;
async function startMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    src.connect(analyser);
    dataArr=new Uint8Array(analyser.frequencyBinCount);
    micActive=true;
    document.getElementById('btn-mic').textContent='mic on';
    document.getElementById('btn-mic').classList.add('active');
  }catch(e){document.getElementById('btn-mic').textContent='mic blocked';}
}
function getAudio(){
  if(!analyser||!dataArr)return{amp:0,zcr:0};
  analyser.getByteTimeDomainData(dataArr);
  let sum=0,zcr=0;
  for(let i=0;i<dataArr.length;i++){
    const v=(dataArr[i]-128)/128;sum+=v*v;
    if(i>0&&((dataArr[i]-128)>=0)!==((dataArr[i-1]-128)>=0))zcr++;
  }
  return{amp:Math.sqrt(sum/dataArr.length),zcr:zcr/dataArr.length};
}

// SIG BARS
const sigBar=document.getElementById('sig-bar');
for(let i=0;i<10;i++){const d=document.createElement('div');d.style.cssText='width:3px;height:4px;background:rgba(200,180,120,.12);border-radius:1px;transition:height .07s,background .07s;';sigBar.appendChild(d);}
const segs=sigBar.querySelectorAll('div');
function updateBars(amp){
  const l=Math.min(1,amp*4);
  segs.forEach((s,i)=>{const t=i/10;s.style.height=(t<l?4+l*18:4)+'px';s.style.background=t<l?'rgba(140,200,160,.5)':'rgba(200,180,120,.12)';});
}

// ─────────────────────────────────────────────────────────
// VISIT + NARRATE
// ─────────────────────────────────────────────────────────
let selected=null,hovered=null,lastVisited=-1;
let autoMode=false,autoTimer=0;
const AUTO_MS=7000;
let lastVisitTime=0,narrateCooldown=0;

function showNarration(text){
  const el=document.getElementById('frag-text');
  el.classList.add('loading');
  setTimeout(()=>{el.textContent=text;el.classList.remove('loading');},320);
}

function visitNode(nd, fromCrumb=false){
  const now=Date.now();
  if(!fromCrumb&&now-lastVisitTime<900)return;
  lastVisitTime=now;
  selected=nd; nd.lit=1;
  nd.harmonics.forEach(hi=>{if(hi<nodes.length)nodes[hi].lit=Math.min(1,nodes[hi].lit+.4);});

  // Compute NAND narration from current spine → next node
  const narration=computeNAND(spine,nd);

  // Then push node to spine AFTER computation (so it doesn't reference itself)
  if(lastVisited!==nd.i){
    lastVisited=nd.i;
    spine.push({type:'node',name:nd.name,col:nd.col,nodeRef:nd});
    renderSpine();
  }

  showNode(nd);
  showNarration(narration);
}

function addNandStar(text){
  if(!text.trim())return;
  spine.push({type:'nand',name:text.trim(),col:[180,140,240]});
  renderSpine();
  // Re-narrate current node with the new star in spine
  if(selected) showNarration(computeNAND(spine.slice(0,-1),selected));
  document.getElementById('nand-input').value='';
}

function showNode(n){
  const nm=document.getElementById('node-name');
  const nb=document.getElementById('node-body');
  if(!n){
    nm.textContent='field interference · spine traversal';nm.style.color='#c8b87a';nm.style.opacity='.42';
    nb.textContent='click a node to begin · the spine narrates itself · NAND a star to elaborate';return;
  }
  const[cr,cg,cb]=n.col;
  nm.textContent=n.name.toUpperCase();
  nm.style.color=`rgb(${cr},${cg},${cb})`;nm.style.opacity='.85';
  nb.textContent=n.body;
  nb.style.color=`rgba(${Math.round(cr*.6+180*.4)},${Math.round(cg*.6+160*.4)},${Math.round(cb*.6+120*.4)},.7)`;
}

// ─────────────────────────────────────────────────────────
// DRAW LOOP
// ─────────────────────────────────────────────────────────
let t=0;
function draw(){
  t+=.008;
  ctx.fillStyle='#050308';ctx.fillRect(0,0,W,H);
  const atm=ctx.createRadialGradient(CX,CY,0,CX,CY,R*1.4);
  atm.addColorStop(0,'rgba(120,80,40,.07)');atm.addColorStop(.5,'rgba(60,40,20,.03)');atm.addColorStop(1,'transparent');
  ctx.fillStyle=atm;ctx.fillRect(0,0,W,H);

  RINGS.forEach((rf,ri)=>{
    ctx.beginPath();ctx.arc(CX,CY,R*rf,0,Math.PI*2);
    ctx.strokeStyle=`rgba(180,140,80,${.04+ri*.02})`;ctx.lineWidth=.5;ctx.stroke();
  });

  // Spine path on canvas
  const spineNodes=spine.filter(s=>s.type==='node').map(s=>nodes.find(n=>n.name===s.name)).filter(Boolean);
  if(spineNodes.length>1){
    for(let i=1;i<spineNodes.length;i++){
      const a=spineNodes[i-1],b=spineNodes[i];
      const progress=i/spineNodes.length;
      const pulse=.5+.5*Math.sin(t*1.1+i*.9);
      const[ar,ag,ab_]=a.col,[br,bg,bb]=b.col;
      const gr=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
      gr.addColorStop(0,`rgba(${ar},${ag},${ab_},${.12+progress*.2})`);
      gr.addColorStop(1,`rgba(${br},${bg},${bb},${(.12+progress*.2)*pulse})`);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=gr;ctx.lineWidth=.8+progress*1.8;
      ctx.setLineDash([3,7]);ctx.stroke();ctx.setLineDash([]);
    }
  }

  // Harmonic threads
  const seen=new Set();
  nodes.forEach((n,i)=>{n.harmonics.forEach(j=>{
    if(j>=nodes.length)return;
    const key=[Math.min(i,j),Math.max(i,j)].join('-');
    if(seen.has(key))return;seen.add(key);
    const a=nodes[i],b=nodes[j];
    const baseLit=Math.max(a.lit,b.lit);
    const isAct=(selected&&(selected.i===i||selected.i===j))||(hovered&&(hovered.i===i||hovered.i===j));
    const[ar,ag,ab_]=a.col,[br,bg,bb]=b.col;
    const r2=Math.round((ar+br)/2),g2=Math.round((ag+bg)/2),bv=Math.round((ab_+bb)/2);
    const alpha=isAct?.27+baseLit*.42:.04+baseLit*.14;
    const pulse=.5+.5*Math.sin(t*.7+i*.4+j*.3);
    const gr=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    gr.addColorStop(0,`rgba(${ar},${ag},${ab_},${alpha})`);
    gr.addColorStop(.5,`rgba(${r2},${g2},${bv},${alpha*(.6+.4*pulse)})`);
    gr.addColorStop(1,`rgba(${br},${bg},${bb},${alpha})`);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=gr;ctx.lineWidth=isAct?1.1+baseLit*1.4:.5+baseLit*.7;ctx.stroke();
  });});

  // Audio
  const{amp,zcr}=getAudio();
  if(micActive){
    updateBars(amp);
    if(amp>.014&&!autoMode){
      const rt=zcr>.15?2:zcr>.07?1:0;
      const ph=((t*amp*3)%1+1)%1;
      const rn=nodes.filter(n=>n.ring===rt);
      if(rn.length){
        let best=rn[0],bestD=Infinity;
        rn.forEach(n=>{const d=Math.abs(((n.a||0)+1)%1-ph);if(d<bestD){bestD=d;best=n;}});
        visitNode(best);
      }
    }
  } else updateBars(0);

  // Auto
  if(autoMode){autoTimer+=16;if(autoTimer>AUTO_MS){autoTimer=0;visitNode(nodes[Math.floor(Math.random()*nodes.length)]);}}

  // Nodes
  nodes.forEach(n=>{
    n.pulse+=n.pulseSpeed;n.lit=Math.max(0,n.lit-n.litDecay);
    const isSel=selected&&selected.i===n.i;
    const isHov=hovered&&hovered.i===n.i;
    const glow=isSel?1:isHov?.75:n.lit;
    const pm=1+.12*Math.sin(n.pulse);
    const sz=n.baseSize*pm*(1+glow*.9);
    const[cr,cg,cb]=n.col;
    const inSpine=spineNodes.includes(n);
    if(inSpine){
      const si=spineNodes.indexOf(n);
      ctx.beginPath();ctx.arc(n.x,n.y,sz*2.9,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${cr},${cg},${cb},${.1+.15*(si/Math.max(1,spineNodes.length-1))})`;
      ctx.lineWidth=.8;ctx.stroke();
    }
    if(glow>.05||isHov){
      const glowR=sz*(3+glow*5);
      const grd=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,glowR);
      grd.addColorStop(0,`rgba(${cr},${cg},${cb},${.28*glow})`);
      grd.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
      ctx.beginPath();ctx.arc(n.x,n.y,glowR,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
    }
    const crd=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,sz);
    crd.addColorStop(0,`rgba(255,255,240,${.7+glow*.3})`);
    crd.addColorStop(.3,`rgba(${cr},${cg},${cb},${.8+glow*.2})`);
    crd.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);
    ctx.beginPath();ctx.arc(n.x,n.y,sz,0,Math.PI*2);ctx.fillStyle=crd;ctx.fill();
    ctx.beginPath();ctx.arc(n.x,n.y,sz*1.6,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},${.1+glow*.38})`;ctx.lineWidth=.5;ctx.stroke();
    if(glow>.2||isHov||isSel){
      const a=Math.min(1,glow+(isHov?.42:0)+(isSel?.8:0));
      ctx.font=`${9+n.ring}px 'Courier New'`;
      ctx.fillStyle=`rgba(${cr},${cg},${cb},${a*.85})`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(n.name.toUpperCase(),n.x,n.y+sz*2.2+7);
    }
  });
}

// ─────────────────────────────────────────────────────────
// INTERACTION
// ─────────────────────────────────────────────────────────
function nearest(mx,my,r){
  let best=null,bestD=r;
  nodes.forEach(n=>{const d=Math.hypot(mx-n.x,my-n.y);if(d<bestD){bestD=d;best=n;}});
  return best;
}
canvas.addEventListener('mousemove',e=>{
  const n=nearest(e.clientX,e.clientY,60);
  if(n!==hovered){hovered=n;if(!selected)showNode(hovered);if(n)n.lit=Math.min(1,n.lit+.42);}
});
canvas.addEventListener('click',e=>{
  const n=nearest(e.clientX,e.clientY,60);
  if(n)visitNode(n);else{selected=null;lastVisited=-1;showNode(null);}
});
canvas.addEventListener('mouseleave',()=>{hovered=null;if(!selected)showNode(null);});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t2=e.touches[0];const n=nearest(t2.clientX,t2.clientY,70);
  if(n)visitNode(n);
},{passive:false});

document.getElementById('btn-mic').addEventListener('click',()=>{
  if(!micActive)startMic();
  else{micActive=false;document.getElementById('btn-mic').textContent='mic off';document.getElementById('btn-mic').classList.remove('active');}
});
document.getElementById('btn-auto').addEventListener('click',()=>{
  autoMode=!autoMode;const b=document.getElementById('btn-auto');
  b.textContent=autoMode?'auto on':'auto';autoMode?b.classList.add('active'):b.classList.remove('active');
  if(autoMode)autoTimer=AUTO_MS;
});
document.getElementById('btn-clear').addEventListener('click',()=>{
  spine=[];selected=null;lastVisited=-1;
  renderSpine();showNode(null);
  document.getElementById('frag-text').textContent='—';
});
document.getElementById('nand-btn').addEventListener('click',()=>addNandStar(document.getElementById('nand-input').value));
document.getElementById('nand-input').addEventListener('keydown',e=>{if(e.key==='Enter')addNandStar(e.target.value);});

function loop(){draw();requestAnimationFrame(loop);}
resize();loop();
</script>
</body>
