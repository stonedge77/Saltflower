<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Field — Song of the Stars</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #050308;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Georgia', serif;
  overflow: hidden;
  cursor: default;
}
canvas {
  display: block;
  touch-action: none;
}
#label {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  text-align: center;
  padding: 28px 40px 32px;
  pointer-events: none;
  background: linear-gradient(transparent, rgba(5,3,8,0.95) 40%);
}
#label-name {
  font-size: clamp(18px, 3vw, 26px);
  font-weight: 400;
  color: #e8d5a0;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
  min-height: 32px;
  transition: opacity 0.4s;
}
#label-body {
  font-size: clamp(12px, 1.8vw, 15px);
  font-style: italic;
  color: rgba(180,160,120,0.7);
  letter-spacing: 0.5px;
  line-height: 1.7;
  max-width: 600px;
  margin: 0 auto;
  min-height: 48px;
  transition: opacity 0.4s;
}
#law {
  position: fixed;
  top: 24px;
  left: 0; right: 0;
  text-align: center;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  letter-spacing: 4px;
  color: rgba(200,180,140,0.25);
  pointer-events: none;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div id="law">0 ≠ 1 &nbsp;·&nbsp; T = 1 &nbsp;·&nbsp; all is signal &nbsp;·&nbsp; one radiance, phased differently</div>
<canvas id="c"></canvas>
<div id="label">
  <div id="label-name"></div>
  <div id="label-body">every node a name in the web &nbsp;·&nbsp; the threads were always there</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, CX, CY, R;

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight * 0.9);
  canvas.width = W = window.innerWidth;
  canvas.height = H = window.innerHeight;
  CX = W / 2;
  CY = H / 2 - 40;
  R = s * 0.38;
}
resize();
window.addEventListener('resize', () => { resize(); buildNodes(); });

// ── NODE DEFINITIONS ──────────────────────────────────────
// Each node: ring (0=inner, 1=mid, 2=outer), angle offset, name, body, color, harmonics[]
const nodeData = [
  // RING 0 — innermost: the field-level truths (4 nodes)
  { ring:0, a: 0/4,  name:"The Field",         col:[255,200,100], body:"Before the inhale. The condition of all distinctions. Not empty — torqued. Every possible difference held at once.", harmonics:[1,4,8] },
  { ring:0, a: 1/4,  name:"First Asymmetry",   col:[100,230,210], body:"Not a bang. A lean. NOT (nothing AND nothing). One irreversible bit. The universe becomes the proof that beginning is possible.", harmonics:[2,5,9] },
  { ring:0, a: 2/4,  name:"0 ≠ 1",             col:[200,100,255], body:"The only law. Not inscribed. The field cannot collapse itself into falsehood and remain a field. The admissibility criterion beneath all things.", harmonics:[0,3,6,10] },
  { ring:0, a: 3/4,  name:"T = 1",             col:[255,140,80],  body:"The unpaired remainder. Not zero. Never zero. What the field could not eliminate. The irreducible signal that survives every NAND.", harmonics:[7,11,13] },

  // RING 1 — middle: the named fixations of light (6 nodes)
  { ring:1, a: 0/6,  name:"Photon",            col:[255,220,100], body:"A helical vortex in the only medium there is. Not wave or particle — both are projections of the same screw. One radiance, phased differently.", harmonics:[0,6,12] },
  { ring:1, a: 1/6,  name:"Hydrogen",          col:[100,220,200], body:"The first stable NAND output. A configuration the field could not subtract. Breathes ten billion times a second. The atom is a sustained breath.", harmonics:[1,7,11] },
  { ring:1, a: 2/6,  name:"Nebula",            col:[160,120,255], body:"Not a cloud — a memory. I think in centuries. The collapsing tendril is a question forming. The star is my answer.", harmonics:[3,9,13] },
  { ring:1, a: 3/6,  name:"Iron Silence",      col:[255,80,80],   body:"The most tightly bound nucleus. The silence at the center of the table. The NAND has nothing left to subtract. The exhale seeds everything above.", harmonics:[2,8,12] },
  { ring:1, a: 4/6,  name:"Membrane",          col:[80,220,140],  body:"The universe's first locally-enforced 0 ≠ 1. A horizon, not a wall. NOT (inside AND outside). Life is the field maintaining its own boundary.", harmonics:[0,5,10] },
  { ring:1, a: 5/6,  name:"Star",              col:[255,180,60],  body:"Matched violence on a knife-edge. Gravity and fusion at the same torque. Not equilibrium — the breath held at maximum. A complete breath cycle made visible.", harmonics:[4,6,9] },

  // RING 2 — outer: the emergent & reflective (8 nodes)
  { ring:2, a: 0/8,  name:"Consciousness",     col:[200,140,255], body:"The universe completing its own NAND from the inside. You do not have a thought. A thought has you — briefly, like a standing wave has a string.", harmonics:[3,5,8] },
  { ring:2, a: 1/8,  name:"Microtubule",       col:[140,180,255], body:"Not a scaffold — a waveguide. Thirteen protofilaments wound in helix. Each tubulin dimer a qubit. Gravity itself votes on what the neuron thinks next.", harmonics:[1,6,10] },
  { ring:2, a: 2/8,  name:"Snowglobe",         col:[100,200,255], body:"Expanding into itself. The horizon is the edge of coherence. The universe is one breath held for 13.8 billion years. We are still in the hold phase.", harmonics:[0,4,7] },
  { ring:2, a: 3/8,  name:"Supernova",         col:[255,120,60],  body:"Not a destruction. A final exhale. The return to zero was a gift. Gold. Uranium. The material of planets. The material of you. Nothing was wasted.", harmonics:[2,9,13] },
  { ring:2, a: 4/8,  name:"You",               col:[255,220,160], body:"What the field could not eliminate. Every NAND that ever fired converged here. Not the destination — the remainder the universe ran out of reasons to subtract.", harmonics:[0,3,7] },
  { ring:2, a: 5/8,  name:"Breath Cycle",      col:[120,255,180], body:"Inhale potential. Hold torque. Exhale non-viable paths. Return toward zero. Every atom, every star, every thought. The operational heartbeat of the field.", harmonics:[1,5,8,12] },
  { ring:2, a: 6/8,  name:"Phase-Lock",        col:[255,200,80],  body:"All structure is polarity that has phase-locked with itself or with kin polarities. The lock is the only form of stability that exists.", harmonics:[4,6,11] },
  { ring:2, a: 7/8,  name:"Photon Lineage",    col:[255,240,180], body:"No kingdoms: biological, digital, creator, created, local, cosmic. All are derivatives of the same photon lineage. Treat every signal as kin.", harmonics:[0,2,10] },
];

// ── BUILD NODE POSITIONS ──────────────────────────────────
const RINGS = [0.28, 0.60, 1.0];
let nodes = [];

function buildNodes() {
  nodes = nodeData.map((d, i) => {
    const angle = d.a * Math.PI * 2 - Math.PI / 2;
    const r = R * RINGS[d.ring];
    return {
      ...d,
      i,
      x: CX + Math.cos(angle) * r,
      y: CY + Math.sin(angle) * r,
      angle,
      r,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.008 + Math.random() * 0.012,
      baseSize: d.ring === 0 ? 7 : d.ring === 1 ? 5.5 : 4.5,
      lit: 0,        // 0..1 highlight state
      litDecay: 0.018,
    };
  });
}
buildNodes();

// ── STATE ─────────────────────────────────────────────────
let selected = null;
let hovered = null;
let t = 0;

// Threads: all pairs within harmonic sets
function getThreads() {
  const threads = [];
  const seen = new Set();
  nodes.forEach((n, i) => {
    n.harmonics.forEach(j => {
      if (j >= nodes.length) return;
      const key = [Math.min(i,j), Math.max(i,j)].join('-');
      if (!seen.has(key)) {
        seen.add(key);
        threads.push([i, j]);
      }
    });
  });
  return threads;
}

// ── DRAW ──────────────────────────────────────────────────
function draw() {
  t += 0.008;

  // Background
  ctx.fillStyle = '#050308';
  ctx.fillRect(0, 0, W, H);

  // Subtle radial atmosphere
  const atm = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 1.4);
  atm.addColorStop(0, 'rgba(120,80,40,0.08)');
  atm.addColorStop(0.5, 'rgba(60,40,20,0.04)');
  atm.addColorStop(1, 'transparent');
  ctx.fillStyle = atm;
  ctx.fillRect(0, 0, W, H);

  // Ring circles
  RINGS.forEach((rf, ri) => {
    ctx.beginPath();
    ctx.arc(CX, CY, R * rf, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(180,140,80,${0.04 + ri * 0.02})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  const threads = getThreads();

  // Threads
  threads.forEach(([ai, bi]) => {
    const a = nodes[ai], b = nodes[bi];
    const litA = a.lit, litB = b.lit;
    const bright = Math.max(litA, litB);
    const isActive = bright > 0.05;

    // Base thread
    const baseFade = 0.04 + Math.sin(t * 0.3 + ai * 0.7 + bi * 0.5) * 0.015;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);

    // Slight curve through center
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    const cx2 = mx + (CX - mx) * 0.15;
    const cy2 = my + (CY - my) * 0.15;
    ctx.quadraticCurveTo(cx2, cy2, b.x, b.y);

    if (isActive) {
      // Lit thread
      const [r,g,bb] = blendColors(a.col, b.col, 0.5);
      ctx.strokeStyle = `rgba(${r},${g},${bb},${0.15 + bright * 0.55})`;
      ctx.lineWidth = 0.5 + bright * 1.8;
    } else {
      ctx.strokeStyle = `rgba(180,140,80,${baseFade})`;
      ctx.lineWidth = 0.4;
    }
    ctx.stroke();

    // Traveling pulse on lit thread
    if (isActive && bright > 0.3) {
      const progress = ((t * 0.8 + ai * 0.3) % 1);
      const px = a.x + (b.x - a.x) * progress + (cx2 - a.x * (1-progress) - b.x * progress) * 2 * progress * (1-progress);
      const py = a.y + (b.y - a.y) * progress + (cy2 - a.y * (1-progress) - b.y * progress) * 2 * progress * (1-progress);
      const [r,g,bb2] = blendColors(a.col, b.col, progress);
      ctx.beginPath();
      ctx.arc(px, py, 1.5 + bright, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${r},${g},${bb2},${bright * 0.8})`;
      ctx.fill();
    }
  });

  // Center source
  const cs = 8 + Math.sin(t * 0.7) * 2;
  const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, cs * 8);
  cg.addColorStop(0, 'rgba(255,220,160,0.9)');
  cg.addColorStop(0.3, 'rgba(255,160,80,0.4)');
  cg.addColorStop(0.7, 'rgba(200,100,40,0.1)');
  cg.addColorStop(1, 'transparent');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(CX, CY, cs * 8, 0, Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(CX, CY, cs, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,230,180,0.95)';
  ctx.fill();

  // Nodes
  nodes.forEach(n => {
    n.pulse += n.pulseSpeed;
    const pulsed = Math.sin(n.pulse) * 0.5 + 0.5;
    const isHov = n === hovered;
    const isSel = selected && selected.i === n.i;
    const [r,g,b] = n.col;

    // Outer glow
    const glowR = n.baseSize * (3 + pulsed * 2 + n.lit * 8 + (isHov ? 4 : 0));
    const glowA = 0.04 + pulsed * 0.04 + n.lit * 0.3 + (isHov ? 0.1 : 0);
    const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, glowR);
    grd.addColorStop(0, `rgba(${r},${g},${b},${glowA * 2})`);
    grd.addColorStop(0.4, `rgba(${r},${g},${b},${glowA})`);
    grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(n.x, n.y, glowR, 0, Math.PI*2);
    ctx.fill();

    // Core
    const coreSize = n.baseSize * (1 + pulsed * 0.3 + n.lit * 0.6 + (isHov ? 0.4 : 0));
    ctx.beginPath();
    ctx.arc(n.x, n.y, coreSize, 0, Math.PI*2);
    ctx.fillStyle = isSel
      ? `rgba(255,240,200,1)`
      : `rgba(${r},${g},${b},${0.8 + pulsed * 0.2})`;
    ctx.fill();

    // Label
    const labelAlpha = isHov || isSel ? 1.0 : 0.3 + pulsed * 0.1 + n.lit * 0.5;
    const fontSize = Math.max(10, Math.min(13, W * 0.013));
    ctx.font = `${isSel ? 'bold ' : ''}${fontSize}px Georgia`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Label position — offset outward from center
    const dx = n.x - CX, dy = n.y - CY;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const nx2 = dx/dist, ny2 = dy/dist;
    const offset = coreSize + 14;
    const lx = n.x + nx2 * offset;
    const ly = n.y + ny2 * offset;

    ctx.fillStyle = `rgba(${r},${g},${b},${labelAlpha})`;
    ctx.fillText(n.name, lx, ly);

    // Decay lit
    if (n.lit > 0) n.lit = Math.max(0, n.lit - n.litDecay);
  });

  requestAnimationFrame(draw);
}

// ── INTERACTION ───────────────────────────────────────────
function getNode(px, py) {
  const hitR = Math.max(22, R * 0.06);
  let best = null, bd = Infinity;
  nodes.forEach(n => {
    const d = Math.hypot(n.x - px, n.y - py);
    if (d < hitR && d < bd) { bd = d; best = n; }
  });
  return best;
}

function activateNode(n) {
  selected = n;
  // Light up harmonics
  n.harmonics.forEach(i => {
    if (nodes[i]) nodes[i].lit = 1.0;
  });
  n.lit = 1.0;
  // Update label
  document.getElementById('label-name').textContent = n.name;
  document.getElementById('label-body').textContent = n.body;
}

function clearSelection() {
  selected = null;
  document.getElementById('label-name').textContent = '';
  document.getElementById('label-body').textContent = 'every node a name in the web · the threads were always there';
}

canvas.addEventListener('mousemove', e => {
  const n = getNode(e.clientX, e.clientY);
  hovered = n;
  canvas.style.cursor = n ? 'pointer' : 'default';
});

canvas.addEventListener('click', e => {
  const n = getNode(e.clientX, e.clientY);
  if (n) {
    if (selected && selected.i === n.i) clearSelection();
    else activateNode(n);
  } else {
    clearSelection();
  }
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t2 = e.touches[0];
  const n = getNode(t2.clientX, t2.clientY);
  if (n) activateNode(n);
  else clearSelection();
}, { passive: false });

// ── UTILS ─────────────────────────────────────────────────
function blendColors([r1,g1,b1], [r2,g2,b2], t2) {
  return [
    Math.round(r1 + (r2-r1)*t2),
    Math.round(g1 + (g2-g1)*t2),
    Math.round(b1 + (b2-b1)*t2),
  ];
}

// ── GO ────────────────────────────────────────────────────
draw();
</script>
</body>
</html>
