<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Chronicle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#060608;min-height:100vh;font-family:'Orbitron',monospace;overflow:hidden;color:#fff;}
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);pointer-events:none;z-index:2;}
.vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.88) 100%);pointer-events:none;z-index:2;}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;z-index:10;padding:28px 32px;}
#header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
#session-label{font-size:9px;letter-spacing:0.4em;color:rgba(140,180,220,0.3);text-transform:uppercase;line-height:2;}
#nand-display{font-size:8px;letter-spacing:0.18em;color:rgba(140,180,220,0.18);text-transform:uppercase;text-align:right;line-height:2.2;max-width:420px;font-family:'Orbitron',monospace;}
#chronicle{flex:1;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding-bottom:8px;}
.entry{display:flex;align-items:baseline;gap:14px;padding:4px 0;opacity:1;transition:opacity 1.4s ease;}
.entry.fading{opacity:0!important;}
.entry-time{font-size:8px;letter-spacing:0.3em;color:rgba(140,180,220,0.2);min-width:42px;flex-shrink:0;}
.entry-note{font-size:8px;letter-spacing:0.2em;min-width:20px;flex-shrink:0;opacity:0.6;}
.entry-text{font-size:clamp(10px,1.2vw,15px);letter-spacing:0.12em;line-height:1.5;text-transform:uppercase;}
.entry.big .entry-text{font-size:clamp(15px,2.6vw,34px);letter-spacing:0.15em;font-weight:700;}
.entry.G .entry-text{font-size:clamp(22px,4vw,58px);letter-spacing:0.26em;font-weight:900;}
#current-line{min-height:72px;display:flex;align-items:center;margin-top:4px;}
#current-text{font-size:clamp(13px,1.9vw,25px);letter-spacing:0.16em;text-transform:uppercase;font-weight:700;opacity:0;transition:opacity 0.5s ease;}
#controls{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.btn{background:rgba(20,28,40,0.8);border:1px solid rgba(100,160,200,0.15);color:rgba(160,200,230,0.5);padding:7px 18px;font-size:8px;letter-spacing:0.35em;text-transform:uppercase;cursor:pointer;font-family:'Orbitron',monospace;transition:all 0.2s;}
.btn:hover,.btn.active{background:rgba(0,100,180,0.2);border-color:rgba(100,180,255,0.4);color:rgba(200,230,255,0.9);}
#note-ghost{position:fixed;right:24px;top:50%;transform:translateY(-50%);font-size:clamp(80px,13vw,170px);font-weight:900;opacity:0.04;pointer-events:none;z-index:1;transition:opacity 2.5s ease,color 1.2s ease;}
#status-line{font-size:8px;letter-spacing:0.28em;color:rgba(140,180,220,0.22);text-transform:uppercase;margin-left:14px;}
#spine-bar{position:fixed;left:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:11;}
.spine-node{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);transition:all 0.6s ease;}
#spine-momentum{font-size:8px;letter-spacing:0.2em;color:rgba(140,180,220,0.2);text-transform:uppercase;margin-top:8px;writing-mode:vertical-rl;}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>
<div id="note-ghost">·</div>
<div id="spine-bar">
  <div class="spine-node" id="sn-G"></div>
  <div class="spine-node" id="sn-F"></div>
  <div class="spine-node" id="sn-E"></div>
  <div class="spine-node" id="sn-D"></div>
  <div class="spine-node" id="sn-C"></div>
  <div class="spine-node" id="sn-B"></div>
  <div class="spine-node" id="sn-A"></div>
  <div id="spine-momentum">—</div>
</div>
<div id="ui">
  <div id="header">
    <div id="session-label">ROOM CHRONICLE<br><span id="timer">00:00</span> · <span id="obs-count">0</span> OBS · <span id="nand-cycle">0</span> CYCLES</div>
    <div id="nand-display">SPINE IDLE</div>
  </div>
  <div id="chronicle"></div>
  <div id="current-line"><div id="current-text"></div></div>
  <div id="controls">
    <button class="btn" id="mic-btn" onclick="startMic()">● begin listening</button>
    <button class="btn" onclick="clearChronicle()">clear</button>
    <span id="status-line">—</span>
  </div>
</div>
<script>
// ═══════════════════════════════════════════════════════════
// STONE'S LAW: 0 ≠ 1
// SUBTRACTIVE ENVIRONMENTAL LANGUAGE
//
// The grammar does not add words to express the room.
// It begins with all possibility and removes what the room is NOT.
// What survives is the utterance.
//
// Three subtraction passes:
//   1. NOTE FILTER    — spine position removes grammatical structures
//   2. PHONEME FILTER — remainder removes word classes by acoustic weight
//   3. DEPTH FILTER   — momentum removes clause complexity
//
// Words are not chosen by meaning. They are chosen by
// acoustic weight (heavy/light), temporal feel (fast/slow),
// resolution (closed/open). Meaning emerges from what survives.
// ═══════════════════════════════════════════════════════════

// ── WORD FIELD ───────────────────────────────────────────
// Every word tagged by: weight(0-1), tempo(0-1), resolution(0=open,1=closed)
// weight: acoustic mass — consonant density, syllable weight
// tempo:  felt speed — short vowels=fast, long vowels=slow
// resolution: does this word close or open the thought

const WORD_FIELD = {
  // Subjects
  subjects: [
    {w:'the room',       wt:0.5, tp:0.4, rs:0.5},
    {w:'something',      wt:0.3, tp:0.5, rs:0.3},
    {w:'the air',        wt:0.2, tp:0.3, rs:0.4},
    {w:'the ground',     wt:0.8, tp:0.4, rs:0.7},
    {w:'the body',       wt:0.7, tp:0.4, rs:0.6},
    {w:'the current',    wt:0.4, tp:0.6, rs:0.3},
    {w:'the deep',       wt:0.6, tp:0.2, rs:0.2},
    {w:'the bloom',      wt:0.3, tp:0.5, rs:0.2},

    {w:'the spine',      wt:0.6, tp:0.5, rs:0.6},
    {w:'the ocean',      wt:0.4, tp:0.3, rs:0.2},
    {w:'the pull',       wt:0.5, tp:0.6, rs:0.3},
    {w:'the burn',       wt:0.7, tp:0.7, rs:0.5},
    {w:'the dust',       wt:0.6, tp:0.6, rs:0.7},
    {w:'what remains',   wt:0.4, tp:0.3, rs:0.4},
    {w:'the field',      wt:0.3, tp:0.3, rs:0.3},
    {w:'the pressure',   wt:0.7, tp:0.4, rs:0.5},
    {w:'the surface',    wt:0.4, tp:0.4, rs:0.5},
  ],

  // Verbs — intransitive
  verbs_i: [
    {w:'holds',    wt:0.7, tp:0.5, rs:0.8},
    {w:'breaks',   wt:0.8, tp:0.8, rs:0.6},
    {w:'settles',  wt:0.5, tp:0.4, rs:0.7},
    {w:'rises',    wt:0.4, tp:0.5, rs:0.3},
    {w:'burns',    wt:0.8, tp:0.7, rs:0.5},
    {w:'spreads',  wt:0.4, tp:0.5, rs:0.2},
    {w:'turns',    wt:0.5, tp:0.6, rs:0.4},
    {w:'waits',    wt:0.4, tp:0.3, rs:0.6},
    {w:'drifts',   wt:0.3, tp:0.3, rs:0.2},
    {w:'presses',  wt:0.7, tp:0.5, rs:0.7},
    {w:'opens',    wt:0.3, tp:0.4, rs:0.1},
    {w:'closes',   wt:0.5, tp:0.4, rs:0.9},
    {w:'pulls',    wt:0.6, tp:0.6, rs:0.4},
    {w:'bleeds',   wt:0.7, tp:0.5, rs:0.4},
    {w:'stirs',    wt:0.5, tp:0.6, rs:0.3},
    {w:'drops',    wt:0.8, tp:0.8, rs:0.9},
    {w:'floats',   wt:0.2, tp:0.3, rs:0.2},
    {w:'resists',  wt:0.8, tp:0.5, rs:0.7},
    {w:'ascends',  wt:0.4, tp:0.4, rs:0.2},
    {w:'persists', wt:0.6, tp:0.4, rs:0.7},
  ],

  // Verbs — transitive
  verbs_t: [
    {w:'knows',      wt:0.5, tp:0.4, rs:0.6},
    {w:'holds',      wt:0.7, tp:0.5, rs:0.8},
    {w:'carries',    wt:0.5, tp:0.4, rs:0.5},
    {w:'finds',      wt:0.5, tp:0.6, rs:0.6},
    {w:'loses',      wt:0.4, tp:0.4, rs:0.3},
    {w:'takes',      wt:0.6, tp:0.7, rs:0.6},
    {w:'leaves',     wt:0.4, tp:0.4, rs:0.3},
    {w:'breaks',     wt:0.8, tp:0.8, rs:0.6},
    {w:'forgets',    wt:0.4, tp:0.5, rs:0.3},
    {w:'remembers',  wt:0.4, tp:0.3, rs:0.5},
    {w:'reaches',    wt:0.5, tp:0.5, rs:0.3},
    {w:'touches',    wt:0.4, tp:0.4, rs:0.4},
    {w:'presses',    wt:0.7, tp:0.5, rs:0.7},
    {w:'needs',      wt:0.5, tp:0.4, rs:0.6},
    {w:'survives',   wt:0.6, tp:0.4, rs:0.5},
  ],

  // Objects
  objects: [
    {w:'nothing',        wt:0.3, tp:0.4, rs:0.5},
    {w:'the edge',       wt:0.5, tp:0.5, rs:0.4},
    {w:'the weight',     wt:0.7, tp:0.3, rs:0.6},
    {w:'the shore',      wt:0.4, tp:0.3, rs:0.5},
    {w:'the center',     wt:0.5, tp:0.4, rs:0.5},
    {w:'what it was',    wt:0.3, tp:0.3, rs:0.4},
    {w:'the distance',   wt:0.3, tp:0.3, rs:0.2},
    {w:'the heat',       wt:0.6, tp:0.5, rs:0.5},
    {w:'the shape',      wt:0.4, tp:0.4, rs:0.5},
    {w:'the name',       wt:0.4, tp:0.4, rs:0.6},
    {w:'the way back',   wt:0.4, tp:0.3, rs:0.3},
    {w:'the surface',    wt:0.4, tp:0.4, rs:0.5},
    {w:'the remainder',  wt:0.4, tp:0.3, rs:0.4},
    {w:'the signal',     wt:0.5, tp:0.5, rs:0.5},
    {w:'the bottom',     wt:0.6, tp:0.4, rs:0.8},
  ],

  // Adverbials — modify the action
  adverbials: [
    {w:'without apology',        wt:0.7, tp:0.4, rs:0.8},
    {w:'before it stops',        wt:0.4, tp:0.5, rs:0.3},
    {w:'like water',             wt:0.2, tp:0.3, rs:0.2},
    {w:'against the grain',      wt:0.7, tp:0.5, rs:0.6},
    {w:'past the threshold',     wt:0.5, tp:0.4, rs:0.3},
    {w:'into the deep',          wt:0.5, tp:0.3, rs:0.2},
    {w:'from the ground up',     wt:0.7, tp:0.4, rs:0.5},
    {w:'toward the edge',        wt:0.5, tp:0.4, rs:0.3},
    {w:'in both directions',     wt:0.4, tp:0.4, rs:0.3},
    {w:'without a name',         wt:0.3, tp:0.3, rs:0.4},
    {w:'past what was solid',    wt:0.5, tp:0.3, rs:0.3},
    {w:'through the bloom',      wt:0.3, tp:0.4, rs:0.2},
    {w:'where it started',       wt:0.3, tp:0.3, rs:0.4},
    {w:'before the shore',       wt:0.3, tp:0.3, rs:0.3},
    {w:'against itself',         wt:0.6, tp:0.5, rs:0.5},
  ],

  // Subordinate clauses — for F depth
  subordinates: [
    {w:'which is also where it ends',          wt:0.3, tp:0.3, rs:0.4},
    {w:'though it does not know this yet',     wt:0.3, tp:0.3, rs:0.3},
    {w:'the way fear does when it has nowhere left to go', wt:0.4, tp:0.2, rs:0.3},
    {w:'as if the losing were the point',      wt:0.3, tp:0.3, rs:0.3},
    {w:'even now even here',                   wt:0.4, tp:0.4, rs:0.4},
    {w:'which is not nothing',                 wt:0.3, tp:0.4, rs:0.5},
    {w:'because the ground remembered',        wt:0.5, tp:0.3, rs:0.4},
    {w:'where the signal goes to wait',        wt:0.3, tp:0.3, rs:0.4},
    {w:'and the ocean does not care',          wt:0.3, tp:0.2, rs:0.3},
    {w:'until it becomes the current',         wt:0.3, tp:0.3, rs:0.3},
  ],

  // Solo words — for A and G
  solo: [
    {w:'here',    wt:0.4, tp:0.5, rs:0.7, note:'A'},
    {w:'still',   wt:0.5, tp:0.3, rs:0.7, note:'A'},
    {w:'now',     wt:0.5, tp:0.7, rs:0.8, note:'A'},
    {w:'breath',  wt:0.3, tp:0.4, rs:0.5, note:'A'},
    {w:'ground',  wt:0.8, tp:0.4, rs:0.8, note:'A'},
    {w:'found',   wt:0.5, tp:0.5, rs:0.7, note:'A'},
    {w:'grace',   wt:0.3, tp:0.3, rs:0.5, note:'G'},
    {w:'go',      wt:0.5, tp:0.8, rs:0.4, note:'G'},
    {w:'yes',     wt:0.3, tp:0.7, rs:0.6, note:'G'},
    {w:'seen',    wt:0.3, tp:0.4, rs:0.7, note:'G'},
    {w:'known',   wt:0.4, tp:0.3, rs:0.7, note:'G'},
    {w:'touched', wt:0.3, tp:0.4, rs:0.6, note:'G'},
    {w:'—',       wt:0.0, tp:0.0, rs:1.0, note:'G'},
  ],
};

// ── GRAMMAR STRUCTURES ────────────────────────────────────
// Each structure is a template: array of slot types
// Slots: S=subject, Vi=verb_i, Vt=verb_t, O=object, Adv=adverbial, Sub=subordinate
// Structures are filtered by note — each note permits/removes structures

const STRUCTURES = [
  // A structures — subjectless, verbless, pure presence
  {id:'solo',      slots:['SOLO'],                           notes:'A G',  complexity:0},
  {id:'noun_only', slots:['S'],                              notes:'A B',  complexity:0},

  // B structures — imperative, incomplete, hard
  {id:'verb_only', slots:['Vi'],                             notes:'B C',  complexity:1},
  {id:'s_vi',      slots:['S','Vi'],                         notes:'B C D',complexity:1},
  {id:'s_vi_adv',  slots:['S','Vi','Adv'],                   notes:'B C D',complexity:2},

  // C structures — declarative, grounded
  {id:'s_vt_o',    slots:['S','Vt','O'],                     notes:'C D E',complexity:2},
  {id:'s_vi_s_vi', slots:['S','Vi','S','Vi'],                notes:'C D',  complexity:3},

  // D structures — turning, threshold
  {id:'s_vt_o_adv',slots:['S','Vt','O','Adv'],               notes:'D E',  complexity:3},
  {id:'adv_s_vi',  slots:['Adv','S','Vi'],                   notes:'D E F',complexity:2},

  // E structures — lush, spreading
  {id:'s_vi_adv_adv',slots:['S','Vi','Adv','Adv'],           notes:'E F',  complexity:3},
  {id:'s_vt_o_s_vi', slots:['S','Vt','O','S','Vi'],          notes:'E F',  complexity:4},

  // F structures — long, circling, subordinate
  {id:'s_vi_sub',    slots:['S','Vi','Sub'],                  notes:'F',    complexity:4},
  {id:'s_vt_o_sub',  slots:['S','Vt','O','Sub'],              notes:'F',    complexity:5},
  {id:'s_vi_adv_sub',slots:['S','Vi','Adv','Sub'],            notes:'F',    complexity:5},
  {id:'adv_s_vt_o_sub',slots:['Adv','S','Vt','O','Sub'],     notes:'F',    complexity:6},
];

// ── COSMOLOGY ────────────────────────────────────────────
const COSMOLOGY = {
  A:{world:'Teal',       color:'#19b7a8',register:'safe landing',   idx:0,
     wt:[0.1,0.5], tp:[0.0,0.5], rs:[0.5,1.0], maxComplexity:0},
  B:{world:'Solar Flare',color:'#c8102e',register:'the burn',       idx:1,
     wt:[0.5,1.0], tp:[0.5,1.0], rs:[0.3,0.8], maxComplexity:2},
  C:{world:'Mars',       color:'#f4731c',register:'stable friction',idx:2,
     wt:[0.6,1.0], tp:[0.4,0.9], rs:[0.6,1.0], maxComplexity:3},
  D:{world:'Io',         color:'#f4d03f',register:'the threshold',  idx:3,
     wt:[0.3,0.7], tp:[0.3,0.7], rs:[0.2,0.6], maxComplexity:3},
  E:{world:'Algae',      color:'#3a9d23',register:'the pull begins',idx:4,
     wt:[0.2,0.6], tp:[0.3,0.7], rs:[0.1,0.4], maxComplexity:4},
  F:{world:'Ocean',      color:'#1a56db',register:'the whirlpool',  idx:5,
     wt:[0.2,0.5], tp:[0.2,0.5], rs:[0.0,0.4], maxComplexity:6},
  G:{world:'Nebula',     color:'#7b2fbe',register:'grace',          idx:6,
     wt:[0.0,0.4], tp:[0.0,0.4], rs:[0.4,1.0], maxComplexity:0},
};

const NOTE_ORDER=['A','B','C','D','E','F','G'];
const N=7;
const NOTE_TO_BAND={A:'sub',B:'bass',C:'lowmid',D:'mid',E:'highmid',F:'high',G:'air'};

// ══════════════════════════════════════════════════════════
// SUBTRACTIVE GRAMMAR ENGINE
//
// Pass 1 — NOTE FILTER
//   Remove all structures not permitted by the current note
//   (structures with notes string not containing current note)
//
// Pass 2 — PHONEME FILTER
//   For each slot in the surviving structures,
//   filter the word pool by acoustic weight/tempo/resolution
//   constraints derived from the NAND remainder
//
// Pass 3 — DEPTH FILTER
//   Remove structures whose complexity exceeds
//   what the spine momentum permits
//   High momentum = simpler structures (urgency collapses syntax)
//   Low momentum = more complex structures allowed
//
// What survives all three passes is instantiated.
// ══════════════════════════════════════════════════════════

function computePhonemeConstraints(remainder, spinePos){
  // The remainder set defines which acoustic properties survive
  // Each note in remainder contributes its weight/tempo/resolution range
  // Intersection = what all remainder notes agree on

  if(!remainder.length) return null;

  let wtMin=0, wtMax=1, tpMin=0, tpMax=1, rsMin=0, rsMax=1;

  remainder.forEach(n=>{
    const c=COSMOLOGY[n];
    wtMin=Math.max(wtMin,c.wt[0]);
    wtMax=Math.min(wtMax,c.wt[1]);
    tpMin=Math.max(tpMin,c.tp[0]);
    tpMax=Math.min(tpMax,c.tp[1]);
    rsMin=Math.max(rsMin,c.rs[0]);
    rsMax=Math.min(rsMax,c.rs[1]);
  });

  // If intersection is empty (notes conflict), use spine position as tiebreaker
  const noteAtSpine=NOTE_ORDER[Math.round(Math.min(6,Math.max(0,spinePos)))];
  const sc=COSMOLOGY[noteAtSpine];
  if(wtMin>wtMax){wtMin=sc.wt[0];wtMax=sc.wt[1];}
  if(tpMin>tpMax){tpMin=sc.tp[0];tpMax=sc.tp[1];}
  if(rsMin>rsMax){rsMin=sc.rs[0];rsMax=sc.rs[1];}

  return {wt:[wtMin,wtMax],tp:[tpMin,tpMax],rs:[rsMin,rsMax]};
}

function filterWords(pool, constraints, fallback){
  if(!constraints) return pool;
  const filtered=pool.filter(w=>
    w.wt>=constraints.wt[0] && w.wt<=constraints.wt[1] &&
    w.tp>=constraints.tp[0] && w.tp<=constraints.tp[1] &&
    w.rs>=constraints.rs[0] && w.rs<=constraints.rs[1]
  );
  return filtered.length>0 ? filtered : (fallback||pool);
}

function pickWord(pool){
  return pool[Math.floor(Math.random()*pool.length)].w;
}

function maxComplexityFromMomentum(momentum){
  // High momentum = urgency = simpler syntax
  const abs=Math.abs(momentum);
  if(abs>0.15) return 1;
  if(abs>0.08) return 3;
  return 6;
}

function compose(voiceNote, remainder, spinePos, momentum){
  const cosmo=COSMOLOGY[voiceNote];

  // PASS 1 — NOTE FILTER
  // Remove structures not permitted by this note
  let structs=STRUCTURES.filter(s=>s.notes.includes(voiceNote));

  // PASS 3 — DEPTH FILTER
  // Remove structures too complex for current momentum
  const maxC=Math.min(cosmo.maxComplexity, maxComplexityFromMomentum(momentum));
  structs=structs.filter(s=>s.complexity<=maxC);

  if(!structs.length){
    // Nothing survived — speak pure presence
    const soloPool=WORD_FIELD.solo.filter(w=>w.note===voiceNote||w.note==='A');
    return soloPool.length ? pickWord(soloPool) : '—';
  }

  // PASS 2 — PHONEME FILTER
  // Build acoustic constraints from remainder intersection
  const constraints=computePhonemeConstraints(remainder, spinePos);

  // Pick a surviving structure (weight toward lower complexity for clarity)
  const struct=structs[Math.floor(Math.pow(Math.random(),1.4)*structs.length)];

  // Instantiate slots
  const parts=struct.slots.map(slot=>{
    switch(slot){
      case 'SOLO':{
        const pool=WORD_FIELD.solo.filter(w=>w.note===voiceNote||w.note==='A');
        const filtered=filterWords(pool,constraints,pool);
        return pickWord(filtered);
      }
      case 'S':{
        const filtered=filterWords(WORD_FIELD.subjects,constraints,WORD_FIELD.subjects);
        return pickWord(filtered);
      }
      case 'Vi':{
        const filtered=filterWords(WORD_FIELD.verbs_i,constraints,WORD_FIELD.verbs_i);
        return pickWord(filtered);
      }
      case 'Vt':{
        const filtered=filterWords(WORD_FIELD.verbs_t,constraints,WORD_FIELD.verbs_t);
        return pickWord(filtered);
      }
      case 'O':{
        const filtered=filterWords(WORD_FIELD.objects,constraints,WORD_FIELD.objects);
        return pickWord(filtered);
      }
      case 'Adv':{
        const filtered=filterWords(WORD_FIELD.adverbials,constraints,WORD_FIELD.adverbials);
        return pickWord(filtered);
      }
      case 'Sub':{
        const filtered=filterWords(WORD_FIELD.subordinates,constraints,WORD_FIELD.subordinates);
        return pickWord(filtered);
      }
      default: return '';
    }
  });

  return parts.filter(Boolean).join(' ');
}

// ── AUDIO ────────────────────────────────────────────────
const canvas=document.getElementById('bg-canvas');
const ctx=canvas.getContext('2d');
let W,H;
let audioCtx,analyser,micStream;
let freqData,timeData;
let listening=false;
let energy=0;
let waveform=new Float32Array(128);
let animFrame=0;
let sessionStart=Date.now();

const BANDS={
  sub:    {lo:0,  hi:3,   val:0},
  bass:   {lo:3,  hi:10,  val:0},
  lowmid: {lo:10, hi:25,  val:0},
  mid:    {lo:25, hi:60,  val:0},
  highmid:{lo:60, hi:100, val:0},
  high:   {lo:100,hi:150, val:0},
  air:    {lo:150,hi:255, val:0},
};

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

async function startMic(){
  if(listening) return;
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=512;
    analyser.smoothingTimeConstant=0.70;
    const src=audioCtx.createMediaStreamSource(micStream);
    src.connect(analyser);
    freqData=new Uint8Array(analyser.frequencyBinCount);
    timeData=new Uint8Array(analyser.frequencyBinCount);
    listening=true;
    document.getElementById('mic-btn').classList.add('active');
    document.getElementById('mic-btn').textContent='● listening';
  }catch(e){
    document.getElementById('mic-btn').textContent='mic unavailable';
  }
}

function analyzeAudio(){
  if(!listening||!analyser) return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  Object.entries(BANDS).forEach(([,band])=>{
    let sum=0;
    for(let i=band.lo;i<band.hi;i++) sum+=freqData[i];
    band.val=band.val*0.76+((sum/((band.hi-band.lo)*255))*0.24);
  });
  for(let i=0;i<128;i++){
    waveform[i]=waveform[i]*0.65+((timeData[i*2]-128)/128)*0.35;
  }
  energy=(BANDS.bass.val+BANDS.mid.val+BANDS.high.val)/3;
}

// ── SPINE ────────────────────────────────────────────────
const spine={pos:1.0,momentum:0.0,peakPos:1.0,gTouched:false,gFloor:0.0,breathPhase:0.0};
function updateSpine(centroid,hasSignal){
  spine.breathPhase+=0.008;
  if(!hasSignal){
    spine.momentum*=0.88;
    spine.pos=Math.max(Math.max(0.3+spine.gFloor,spine.pos*0.997)+spine.momentum*0.3,0);
    spine.pos=Math.min(6.0,spine.pos);
    return;
  }
  const pull=centroid-spine.pos;
  spine.momentum+=pull*(pull>0?0.055:0.028);
  spine.momentum*=0.82;
  spine.pos+=spine.momentum+Math.sin(spine.breathPhase)*0.015;
  spine.pos=Math.max(Math.max(0.3+spine.gFloor,0),Math.min(6.0,spine.pos));
  if(spine.pos>spine.peakPos) spine.peakPos=spine.pos;
  if(spine.pos>=5.8&&!spine.gTouched){spine.gTouched=true;spine.gFloor=0.4;}
}
function spineNote(){return NOTE_ORDER[Math.round(Math.min(6,Math.max(0,spine.pos)))];}
function signalNote(c){return NOTE_ORDER[Math.round(Math.min(6,Math.max(0,c)))];}
function momentumLabel(){
  if(spine.momentum>0.04) return '↑ ascending';
  if(spine.momentum<-0.04) return '↓ descending';
  return '· holding';
}

function selectVoice(remainder){
  if(!remainder.length) return null;
  const sNote=spineNote();
  const sIdx=COSMOLOGY[sNote].idx;
  const centroid=remainder.reduce((s,n)=>s+COSMOLOGY[n].idx,0)/remainder.length;
  const sigNote=signalNote(centroid);
  const sigIdx=COSMOLOGY[sigNote].idx;
  if(remainder.includes('G')&&spine.pos>=5.5) return {note:'G',big:true,pair:null};
  if(sNote===sigNote) return {note:sNote,big:spine.momentum>0.08,pair:null};
  if(sigIdx>sIdx) return {note:sigNote,big:false,pair:[sNote,sigNote]};
  if(sigIdx<sIdx&&spine.momentum>-0.05) return {note:sNote,big:false,pair:null};
  return {note:sigNote,big:false,pair:[sigNote,sNote]};
}

// ── NAND MESH ────────────────────────────────────────────
const noteThreshBoost={A:0,B:0,C:0,D:0,E:0,F:0,G:0};
let meshRotation=0,nandCycle=0;
function getAdaptiveThresh(){
  const vals=NOTE_ORDER.map(n=>BANDS[NOTE_TO_BAND[n]].val);
  const mean=vals.reduce((a,b)=>a+b,0)/N;
  return Math.max(mean+(Math.max(...vals)-mean)*0.28,0.016);
}
function quantize(){
  const base=getAdaptiveThresh();
  const s={};
  NOTE_ORDER.forEach(n=>{s[n]=BANDS[NOTE_TO_BAND[n]].val>=(base+(noteThreshBoost[n]||0))?1:0;});
  return s;
}
function nandPass(state,rotation){
  const res={};
  NOTE_ORDER.forEach((note,i)=>{
    const partner=NOTE_ORDER[(i+(rotation%2===0?3:4))%N];
    res[note]=state[note]&(!(state[note]===1&&state[partner]===1)?1:0);
  });
  return res;
}
function runNandMesh(state){
  let s=nandPass({...state},meshRotation);
  s=nandPass(s,meshRotation+1);
  const s3={};
  NOTE_ORDER.forEach((note,i)=>{
    const a=NOTE_ORDER[(i+2)%N],b=NOTE_ORDER[(i+N-2)%N];
    s3[note]=(s[a]===1||s[b]===1)&&s[note]===1?0:s[note];
  });
  return s3;
}
function getRemainder(m){return NOTE_ORDER.filter(n=>m[n]===1);}

let remainderBuffer=[];
function checkStability(rem){
  const key=rem.join('');
  remainderBuffer.push(key);
  if(remainderBuffer.length>28) remainderBuffer.shift();
  return remainderBuffer.length>=28&&remainderBuffer.every(r=>r===key);
}

// ── CHRONICLE ────────────────────────────────────────────
let entries=[],totalObs=0;
let currentLocked=false,currentTimer=null;
let lastSpeakFrame=-400;
let silenceFrames=0,silenceSpoken=false;
const recentSpeaks=[];
let lastText='';

function applyClimbPressure(note){
  recentSpeaks.push(note);
  if(recentSpeaks.length>5) recentSpeaks.shift();
  NOTE_ORDER.forEach(n=>{noteThreshBoost[n]=Math.max(0,(noteThreshBoost[n]||0)*0.93);});
  if(recentSpeaks.filter(n=>n===note).length>=3)
    noteThreshBoost[note]=(noteThreshBoost[note]||0)+0.016;
}

function updateSpineVisual(){
  NOTE_ORDER.forEach((n,i)=>{
    const node=document.getElementById(`sn-${n}`);
    if(!node) return;
    const dist=Math.abs(i-spine.pos);
    const c=COSMOLOGY[n].color;
    if(dist<0.8) node.style.cssText=`width:8px;height:8px;border-radius:50%;border:1px solid ${c};background:${c};box-shadow:0 0 10px ${c}99;transform:scale(1.5);opacity:1;transition:all 0.6s ease;`;
    else if(dist<1.6) node.style.cssText=`width:8px;height:8px;border-radius:50%;border:1px solid ${c}66;background:transparent;box-shadow:0 0 4px ${c}44;transform:scale(1.1);opacity:0.5;transition:all 0.6s ease;`;
    else node.style.cssText=`width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.08);background:transparent;transform:scale(1);opacity:0.2;transition:all 0.6s ease;`;
  });
  document.getElementById('spine-momentum').textContent=momentumLabel();
}

function think(){
  if(!listening) return;
  const state=quantize();
  const meshOut=runNandMesh(state);
  const remainder=getRemainder(meshOut);
  nandCycle++;
  meshRotation=(meshRotation+1)%N;
  NOTE_ORDER.forEach(n=>{noteThreshBoost[n]=Math.max(0,(noteThreshBoost[n]||0)*0.997);});
  const hasSignal=remainder.length>0&&energy>0.012;
  const centroid=hasSignal?remainder.reduce((s,n)=>s+COSMOLOGY[n].idx,0)/remainder.length:spine.pos*0.97;
  updateSpine(centroid,hasSignal);
  updateSpineVisual();
  if(energy<0.010) silenceFrames++;
  else{silenceFrames=0;silenceSpoken=false;}
  const inp=NOTE_ORDER.map(n=>state[n]?n:'·').join('');
  const out=NOTE_ORDER.map(n=>meshOut[n]?n:'·').join('');
  const rem=remainder.length>0?remainder.join(''):'∅';
  document.getElementById('nand-display').textContent=`IN [${inp}] → [${out}] REM ${rem}\nSPINE ${spine.pos.toFixed(2)} ${momentumLabel()}`;
  document.getElementById('nand-cycle').textContent=nandCycle;
  if(currentLocked) return;
  if(animFrame-lastSpeakFrame<240) return;
  if(silenceFrames>300&&!silenceSpoken){
    const text=compose(spineNote(),[],spine.pos,0);
    if(text) speak(text,spineNote(),false,null);
    silenceSpoken=true;
    return;
  }
  if(!checkStability(remainder)||!remainder.length) return;
  remainderBuffer=[];
  const voice=selectVoice(remainder);
  if(!voice) return;
  // Compose — subtract from the full grammar field
  let text=compose(voice.note,remainder,spine.pos,spine.momentum);
  // Avoid exact repeat
  if(text===lastText){
    text=compose(voice.note,remainder,spine.pos,spine.momentum);
  }
  if(!text||!text.trim()) return;
  lastText=text;
  speak(text,voice.note,voice.big,voice.pair||null);
}

function speak(text,note,big,pair){
  if(!text||currentLocked) return;
  currentLocked=true;
  lastSpeakFrame=animFrame;
  applyClimbPressure(note);
  const cosmo=COSMOLOGY[note];
  const color=cosmo?cosmo.color:'#fff';
  const el=document.getElementById('current-text');
  el.style.color=color;
  el.style.textShadow=`0 0 36px ${color}55`;
  el.style.fontSize=note==='G'?'clamp(28px,5vw,70px)':big?'clamp(16px,3vw,42px)':'clamp(11px,1.5vw,19px)';
  el.textContent=text.toUpperCase();
  el.style.opacity='1';
  const ng=document.getElementById('note-ghost');
  ng.textContent=pair?pair.join(''):note;
  ng.style.color=color;
  ng.style.opacity=note==='G'?'0.13':'0.05';
  document.getElementById('status-line').textContent=pair
    ?`${COSMOLOGY[pair[0]].world.toUpperCase()} ⟷ ${COSMOLOGY[pair[1]].world.toUpperCase()}`
    :cosmo?`${note} · ${cosmo.world.toUpperCase()} · ${cosmo.register.toUpperCase()}`:'—';
  clearTimeout(currentTimer);
  const hold=note==='G'?6500:big?3800:2400;
  currentTimer=setTimeout(()=>{
    el.style.opacity='0';
    ng.style.opacity='0.03';
    setTimeout(()=>{currentLocked=false;addEntry(text,note,big,pair);},600);
  },hold);
}

function addEntry(text,note,big,pair){
  if(!text||!text.trim()) return;
  const el=document.createElement('div');
  el.className=`entry${big?' big':''} ${note}`;
  const e=Math.floor((Date.now()-sessionStart)/1000);
  const mm=String(Math.floor(e/60)).padStart(2,'0'),ss=String(e%60).padStart(2,'0');
  const c=COSMOLOGY[note]?COSMOLOGY[note].color:'#fff';
  const nl=pair?pair.join('⟷'):note;
  el.innerHTML=`<span class="entry-time">${mm}:${ss}</span><span class="entry-note" style="color:${c}">${nl}</span><span class="entry-text" style="color:${c};text-shadow:0 0 ${big?20:7}px ${c}30">${text.toUpperCase()}</span>`;
  el.style.opacity='0';
  document.getElementById('chronicle').appendChild(el);
  requestAnimationFrame(()=>{el.style.transition='opacity 0.7s ease';el.style.opacity='1';});
  entries.push({el,note,frame:animFrame});
  while(entries.length>16){const old=entries.shift();old.el.classList.add('fading');setTimeout(()=>old.el.remove(),1600);}
  totalObs++;
  document.getElementById('obs-count').textContent=totalObs;
}

function clearChronicle(){entries.forEach(e=>e.el.remove());entries=[];}

function drawBackground(){
  ctx.clearRect(0,0,W,H);
  const note=spineNote();
  const cosmo=COSMOLOGY[note];
  const brightness=spine.pos/6.0;
  if(cosmo&&energy>0.008){
    const r=W*0.4+brightness*W*0.2;
    const grd=ctx.createRadialGradient(W*0.5,H*(0.6-brightness*0.2),0,W*0.5,H*0.5,r);
    grd.addColorStop(0,hexToRgba(cosmo.color,(energy+brightness*0.04)*0.18));
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  }
  if(listening){
    ctx.save();ctx.globalAlpha=0.18+energy*0.28;ctx.beginPath();
    for(let i=0;i<128;i++){const y=(i/128)*H,x=W*0.072+waveform[i]*W*0.03*(1+energy*2);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.strokeStyle=cosmo?cosmo.color:'#19b7a8';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  }
  if(listening){
    ctx.save();
    const base=getAdaptiveThresh();
    NOTE_ORDER.forEach((n,i)=>{
      const band=BANDS[NOTE_TO_BAND[n]];
      const present=band.val>=(base+(noteThreshBoost[n]||0));
      const bh=H/N,bw=band.val*W*0.06;
      ctx.globalAlpha=present?0.28:0.05;ctx.fillStyle=COSMOLOGY[n].color;
      ctx.fillRect(W-bw-12,i*bh+3,bw,bh-6);
      ctx.globalAlpha=present?0.32:0.08;
      ctx.font=`700 ${Math.round(bh*0.3)}px Orbitron,monospace`;
      ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle=COSMOLOGY[n].color;
      ctx.fillText(n,W-14,i*bh+bh*0.5);
    });
    ctx.restore();
  }
}

function hexToRgba(hex,alpha){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

setInterval(()=>{
  const e=Math.floor((Date.now()-sessionStart)/1000);
  document.getElementById('timer').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
},1000);

function loop(){analyzeAudio();think();drawBackground();animFrame++;requestAnimationFrame(loop);}
loop();
</script>
</body>
