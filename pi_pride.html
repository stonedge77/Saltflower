<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>π Pride · 3.14 · the remainder that persists</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  canvas { display: block; position: fixed; top: 0; left: 0; }

  #title {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.18);
    text-transform: uppercase;
    pointer-events: none;
    white-space: nowrap;
  }

  #pi-digits {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.1);
    pointer-events: none;
    white-space: nowrap;
    transition: color 1s ease;
  }

  #remainder-display {
    position: fixed;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.2);
    pointer-events: none;
  }

  #controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 100;
  }

  .note-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: transparent;
    color: rgba(255,255,255,0.5);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .note-btn:hover {
    transform: scale(1.25);
    border-color: rgba(255,255,255,0.6);
    color: #fff;
  }

  #mic-btn {
    padding: 0 16px;
    height: 34px;
    border-radius: 17px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.4);
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }
  #mic-btn:hover { border-color: rgba(255,255,255,0.5); color: rgba(255,255,255,0.8); }
  #mic-btn.active { border-color: rgba(255,100,100,0.6); color: rgba(255,150,150,0.8); }

  #center-signal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0);
    pointer-events: none;
    transition: color 3s ease;
  }
</style>
</head>
<body>

<div id="title">π pride · 3.14 · the remainder that will not resolve</div>
<div id="remainder-display">· · ·</div>
<canvas id="c"></canvas>
<div id="center-signal">∅</div>
<div id="pi-digits">3.14159265358979323846264338327950288419716939937510</div>

<div id="controls">
  <div id="note-btns"></div>
  <button id="mic-btn" onclick="startMic()">activate mic</button>
</div>

<script>
// ── COSMOLOGY ─────────────────────────────────────────────
const COSMOLOGY = {
  A: { color:'#19b7a8', world:'Teal',        idx:0, rgb:[25,183,168],  band:'sub'     },
  B: { color:'#c8102e', world:'Solar Flare', idx:1, rgb:[200,16,46],   band:'bass'    },
  C: { color:'#f4731c', world:'Mars',        idx:2, rgb:[244,115,28],  band:'lowmid'  },
  D: { color:'#f4d03f', world:'Io',          idx:3, rgb:[244,208,63],  band:'mid'     },
  E: { color:'#3a9d23', world:'Algae',       idx:4, rgb:[58,157,35],   band:'highmid' },
  F: { color:'#1a56db', world:'Ocean',       idx:5, rgb:[26,86,219],   band:'high'    },
  G: { color:'#7b2fbe', world:'Nebula',      idx:6, rgb:[123,47,190],  band:'air'     },
};
const NOTE_ORDER = ['A','B','C','D','E','F','G'];

// π digits for spawning sequence — the transcendental order
const PI_DIGITS = '14159265358979323846264338327950288419716939937510';
let piIdx = 0;
function nextPiNote() {
  const d = parseInt(PI_DIGITS[piIdx % PI_DIGITS.length]);
  piIdx++;
  // Map digit to note: 0→A, 1→B, 2→C, ... 6→G, 7→F, 8→E, 9→D (fold back)
  const map = ['A','B','C','D','E','F','G','F','E','D'];
  return map[d];
}

// ── CANVAS ────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, CX, CY, R;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2; CY = H / 2;
  R  = Math.min(W, H) * 0.42;
}
resize();
window.addEventListener('resize', resize);

// ── AUDIO ─────────────────────────────────────────────────
let audioCtx, analyser, micStream;
let freqData = new Uint8Array(256), timeData = new Uint8Array(256);
let listening = false;
const waveform = new Float32Array(64);
let energy = 0;

const BANDS = {
  sub:     { lo:0,   hi:3,   val:0 },
  bass:    { lo:3,   hi:10,  val:0 },
  lowmid:  { lo:10,  hi:25,  val:0 },
  mid:     { lo:25,  hi:60,  val:0 },
  highmid: { lo:60,  hi:100, val:0 },
  high:    { lo:100, hi:150, val:0 },
  air:     { lo:150, hi:255, val:0 },
};

async function startMic() {
  if (listening) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    const src = audioCtx.createMediaStreamSource(micStream);
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.frequencyBinCount);
    listening = true;
    const btn = document.getElementById('mic-btn');
    btn.classList.add('active');
    btn.textContent = 'listening ●';
  } catch(e) {
    document.getElementById('mic-btn').textContent = 'mic unavailable';
  }
}

function analyzeAudio() {
  if (!listening || !analyser) return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  for (const band of Object.values(BANDS)) {
    let sum = 0;
    for (let i = band.lo; i < band.hi; i++) sum += freqData[i];
    band.val = band.val * 0.72 + (sum / ((band.hi - band.lo) * 255)) * 0.28;
  }
  for (let i = 0; i < 64; i++) {
    waveform[i] = waveform[i] * 0.6 + ((timeData[i*4] - 128) / 128) * 0.4;
  }
  energy = (BANDS.bass.val + BANDS.mid.val + BANDS.high.val) / 3;
}

// ── NOTE NODE ─────────────────────────────────────────────
class NoteNode {
  constructor(note, fromMic = false) {
    const c = COSMOLOGY[note];
    this.note    = note;
    this.color   = c.color;
    this.rgb     = c.rgb;
    this.world   = c.world;
    this.fromMic = fromMic;

    this.entryAngle = Math.random() * Math.PI * 2;
    this.r     = R * (0.88 + Math.random() * 0.18);
    this.angle = this.entryAngle;

    // All nodes spiral clockwise — same direction as the whirlpool
    this.angularVel = -(0.007 + Math.random() * 0.007);

    this.x = CX + Math.cos(this.angle) * this.r;
    this.y = CY + Math.sin(this.angle) * this.r;

    // Mic nodes are bigger, pulsier
    this.size      = fromMic ? 9 + Math.random() * 5 : 5 + Math.random() * 4;
    this.baseSize  = this.size;
    this.alpha     = 0;
    this.born      = performance.now();
    this.glowPulse = Math.random() * Math.PI * 2;

    // Perturbation
    this.perturbX  = 0;
    this.perturbY  = 0;

    // Trail
    this.trail    = [];
    this.maxTrail = fromMic ? 80 : 55;

    // S-curve perturbation on entry — the whirlpool receives and wobbles
    this.entryPerturbPhase = 0;
    this.entryPerturbing   = true;

    this.absorbed   = false;
    this.absorbT    = 0;
    this._registered = false;
  }

  perturb(force) {
    const a = Math.random() * Math.PI * 2;
    this.perturbX += Math.cos(a) * force;
    this.perturbY += Math.sin(a) * force;
  }

  update(dt) {
    if (this.absorbed) {
      this.absorbT += dt * 0.0035;
      this.alpha    = Math.max(0, 1 - this.absorbT);
      this.size    *= 0.96;
      return;
    }

    // Fade in
    this.alpha = Math.min(1, this.alpha + dt * 0.0025);

    // Entry perturbation — S-curve wobble as node enters the field
    if (this.entryPerturbing) {
      this.entryPerturbPhase += dt * 0.008;
      const wobble = Math.sin(this.entryPerturbPhase) * 3 * Math.exp(-this.entryPerturbPhase * 0.3);
      this.perturbX += wobble * Math.cos(this.angle + Math.PI/2);
      this.perturbY += wobble * Math.sin(this.angle + Math.PI/2);
      if (this.entryPerturbPhase > 4) this.entryPerturbing = false;
    }

    // Inward spiral — accelerates as r shrinks (conservation of angular momentum)
    const pullStrength = 0.00025 + (1 - this.r / R) * 0.0009;
    this.r    = Math.max(0, this.r - pullStrength * this.r * dt);
    // Angular velocity increases as radius shrinks — whirlpool physics
    const vScale = 1 + Math.pow(Math.max(0, 1 - this.r / R), 2) * 4;
    this.angle += this.angularVel * dt * vScale;

    // Perturbation decay
    this.perturbX *= 0.91;
    this.perturbY *= 0.91;

    // Mic energy modulates size
    if (this.fromMic) {
      this.size = this.baseSize * (1 + energy * 1.5);
    }

    this.x = CX + Math.cos(this.angle) * this.r + this.perturbX;
    this.y = CY + Math.sin(this.angle) * this.r + this.perturbY;
    this.glowPulse += dt * 0.0035;

    // Trail
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    if (this.r < 10) this.absorbed = true;
  }

  draw(ctx) {
    if (this.alpha <= 0.01) return;
    const [r, g, b] = this.rgb;

    // Trail — fading colored wake
    for (let i = 1; i < this.trail.length; i++) {
      const p0 = this.trail[i-1], p1 = this.trail[i];
      const prog = i / this.trail.length;
      const ta   = prog * prog * this.alpha * (this.fromMic ? 0.5 : 0.3);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.strokeStyle = `rgba(${r},${g},${b},${ta})`;
      ctx.lineWidth   = prog * this.size * 0.45;
      ctx.stroke();
    }

    // Outer glow
    const pulse  = 0.65 + 0.35 * Math.sin(this.glowPulse);
    const micBoost = this.fromMic ? 1 + energy * 2 : 1;
    const glowR  = this.size * (2.5 + pulse * 2) * micBoost;
    const grd    = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowR);
    grd.addColorStop(0, `rgba(${r},${g},${b},${this.alpha * 0.55 * micBoost})`);
    grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, glowR, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Core white center
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.7 * (0.85 + pulse * 0.15), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,245,${this.alpha * 0.95})`;
    ctx.fill();

    // Color ring
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha * 0.65})`;
    ctx.fill();

    // Label
    if (this.alpha > 0.25 && !this.absorbed && this.r > 20) {
      ctx.save();
      ctx.fillStyle = `rgba(255,255,255,${this.alpha * 0.9})`;
      ctx.font      = `bold ${Math.max(8, this.size * 1.1)}px 'Courier New'`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.note, this.x, this.y);
      ctx.restore();
    }
  }
}

// ── SUBTRACTIVE CENTER ────────────────────────────────────
let absorbedLog   = [];   // rolling window of absorbed note rgbs
let centerColor   = [0,0,0];
let centerAlpha   = 0;
let centerPulse   = 0;
let totalAbsorbed = 0;

function computeCenter() {
  if (absorbedLog.length === 0) { centerAlpha = 0; return; }
  // Start from white, subtract each absorbed color's complement contribution
  let rr = 255, gg = 255, bb = 255;
  // Weight recent absorptions more heavily
  absorbedLog.forEach((rgb, i) => {
    const weight = (i + 1) / absorbedLog.length * 0.7;
    rr = Math.max(0, rr - rgb[0] * weight);
    gg = Math.max(0, gg - rgb[1] * weight);
    bb = Math.max(0, bb - rgb[2] * weight);
  });
  centerColor = [rr, gg, bb];
  centerAlpha = Math.min(0.85, absorbedLog.length * 0.12);
}

function drawCenter() {
  const [r, g, b] = centerColor;
  centerPulse += 0.018;

  // Deep void — the axis that can't be filled
  const voidR = 55 + energy * 20;
  const vg    = ctx.createRadialGradient(CX, CY, 0, CX, CY, voidR);
  vg.addColorStop(0,   'rgba(0,0,0,1)');
  vg.addColorStop(0.5, 'rgba(0,0,0,0.97)');
  vg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(CX, CY, voidR, 0, Math.PI * 2);
  ctx.fillStyle = vg;
  ctx.fill();

  // Subtractive signal emerges in the void gap
  if (centerAlpha > 0.05) {
    const pulse  = 0.6 + 0.4 * Math.sin(centerPulse);
    const sigR   = 12 + pulse * 6 + energy * 15;
    const sigGrd = ctx.createRadialGradient(CX, CY, 0, CX, CY, sigR * 5);
    sigGrd.addColorStop(0,   `rgba(${r},${g},${b},${centerAlpha * pulse})`);
    sigGrd.addColorStop(0.35,`rgba(${r},${g},${b},${centerAlpha * 0.45})`);
    sigGrd.addColorStop(0.7, `rgba(${r},${g},${b},${centerAlpha * 0.1})`);
    sigGrd.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(CX, CY, sigR * 5, 0, Math.PI * 2);
    ctx.fillStyle = sigGrd;
    ctx.fill();

    // Update center label
    const label = document.getElementById('center-signal');
    const la    = Math.min(0.55, centerAlpha * 0.7);
    label.style.color = `rgba(${r},${g},${b},${la})`;
    label.textContent = totalAbsorbed >= 7 ? 'π' : '∅';
  }

  // Axis point — the stillness at the center of the whirlpool
  ctx.beginPath();
  ctx.arc(CX, CY, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,255,255,${0.1 + energy * 0.3})`;
  ctx.fill();
}

// ── SPIRAL FIELD ARMS ─────────────────────────────────────
let fieldRot = 0;

function drawFieldArms() {
  // π-ratio arms: not 3, not 4 — 3.14159... arms implied through phase offset
  const armCount = 3;
  const piOffset = (Math.PI * 2) / (Math.PI);  // irrational spacing

  for (let arm = 0; arm < armCount; arm++) {
    const baseAngle = arm * piOffset + fieldRot;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i < 220; i++) {
      const t  = i / 220;
      const sr = t * R * 1.05;
      const sa = baseAngle + t * Math.PI * 5.14;  // π in the winding
      const sx = CX + Math.cos(sa) * sr;
      const sy = CY + Math.sin(sa) * sr;
      if (first) { ctx.moveTo(sx, sy); first = false; }
      else ctx.lineTo(sx, sy);
    }
    const alpha = 0.03 + energy * 0.04 + Math.sin(fieldRot * 3 + arm) * 0.01;
    ctx.strokeStyle = `rgba(255,255,255,${Math.max(0.01, alpha)})`;
    ctx.lineWidth   = 0.4;
    ctx.stroke();
  }
}

// ── RINGS ─────────────────────────────────────────────────
function drawRings() {
  // π-spaced rings — irrational spacing means they never repeat cleanly
  const piSpacings = [0.2, 0.2 * Math.PI / 2, 0.5, 0.5 * Math.PI / 3, 1.0];
  piSpacings.forEach((rf, i) => {
    if (rf > 1.05) return;
    ctx.beginPath();
    ctx.arc(CX, CY, R * rf, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.025 + i * 0.008})`;
    ctx.lineWidth   = 0.5;
    ctx.setLineDash([3, 9]);
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

// ── MIC-DRIVEN SPAWNING ───────────────────────────────────
let lastMicSpawn  = 0;
let micSpawnCool  = 0;
let prevEnergy    = 0;

function handleMicSpawning(now) {
  if (!listening) return;
  micSpawnCool = Math.max(0, micSpawnCool - 16);

  // Spawn on energy transient — when signal crosses threshold
  const delta = energy - prevEnergy;
  if (delta > 0.04 && micSpawnCool === 0 && now - lastMicSpawn > 300) {
    // Find dominant band and map to note
    let domBand = 'mid', domVal = 0;
    Object.entries(BANDS).forEach(([k, v]) => {
      if (v.val > domVal) { domVal = v.val; domBand = k; }
    });
    const bandToNote = {
      sub:'A', bass:'B', lowmid:'C', mid:'D', highmid:'E', high:'F', air:'G'
    };
    const note = bandToNote[domBand] || nextPiNote();
    spawnNote(note, true);
    lastMicSpawn = now;
    micSpawnCool = 180;
  }

  // Sustained energy spawns at lower rate
  if (energy > 0.08 && now - lastMicSpawn > 800 && micSpawnCool === 0) {
    spawnNote(nextPiNote(), true);
    lastMicSpawn = now;
    micSpawnCool = 400;
  }

  prevEnergy = energy;
}

// ── AUTO SPAWN (π sequence) ───────────────────────────────
let nodes         = [];
let lastAutoSpawn = 0;
let autoInterval  = 1600;

function spawnNote(note, fromMic = false) {
  const n = new NoteNode(note, fromMic);
  // Perturb nearby nodes on entry — the S-curve disturbance
  nodes.forEach(existing => {
    if (!existing.absorbed) {
      const dx = existing.x - (CX + Math.cos(n.entryAngle) * n.r);
      const dy = existing.y - (CY + Math.sin(n.entryAngle) * n.r);
      const d  = Math.sqrt(dx*dx + dy*dy);
      if (d < 130) existing.perturb(3 + Math.random() * 5);
    }
  });
  nodes.push(n);
}

// ── HUD BUTTONS ───────────────────────────────────────────
const noteBtns = document.getElementById('note-btns');
noteBtns.style.display = 'flex';
noteBtns.style.gap = '10px';
NOTE_ORDER.forEach(note => {
  const c   = COSMOLOGY[note];
  const btn = document.createElement('button');
  btn.className   = 'note-btn';
  btn.textContent = note;
  btn.title       = c.world;
  btn.style.borderColor = c.color + '88';
  btn.style.color       = c.color;
  btn.addEventListener('click', () => spawnNote(note));
  noteBtns.appendChild(btn);
});

// ── REMAINDER DISPLAY ─────────────────────────────────────
function updateRemainder() {
  const active = [...new Set(nodes.filter(n => !n.absorbed).map(n => n.note))];
  const el     = document.getElementById('remainder-display');
  if (active.length === 0) {
    el.textContent = '· · ·';
    el.style.color = 'rgba(255,255,255,0.12)';
  } else {
    el.textContent = active.join(' · ');
    el.style.color = 'rgba(255,255,255,0.4)';
  }
  // Pi digits pulse with energy
  const pd = document.getElementById('pi-digits');
  pd.style.color = `rgba(255,255,255,${0.06 + energy * 0.25})`;
}

// ── MAIN LOOP ─────────────────────────────────────────────
let last  = performance.now();
let frame = 0;

function loop(now) {
  const dt = Math.min(now - last, 50);
  last = now;
  frame++;
  fieldRot += 0.0007;

  analyzeAudio();
  handleMicSpawning(now);

  // Auto spawn following π digit sequence
  if (now - lastAutoSpawn > autoInterval) {
    spawnNote(nextPiNote());
    lastAutoSpawn = now;
    autoInterval  = 1200 + Math.random() * 1400 - energy * 400;
  }

  // Background — deep trail persistence
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.fillRect(0, 0, W, H);

  drawRings();
  drawFieldArms();

  // Update nodes & register absorptions
  nodes.forEach(n => {
    n.update(dt);
    if (n.absorbed && !n._registered && n.absorbT > 0.1) {
      n._registered = true;
      absorbedLog.push(n.rgb);
      if (absorbedLog.length > 12) absorbedLog.shift();
      totalAbsorbed++;
      computeCenter();
    }
  });

  // Draw nodes sorted back-to-front
  nodes.sort((a, b) => b.r - a.r);
  nodes.forEach(n => n.draw(ctx));

  drawCenter();
  updateRemainder();

  // Waveform ring around void — voice becomes visible in the whirlpool
  if (listening && energy > 0.015) {
    ctx.beginPath();
    const wR = 65 + energy * 25;
    for (let i = 0; i < 64; i++) {
      const a    = (i / 64) * Math.PI * 2;
      const disp = waveform[i] * 20 * energy * 8;
      const px   = CX + Math.cos(a) * (wR + disp);
      const py   = CY + Math.sin(a) * (wR + disp);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = `rgba(255,255,255,${0.12 + energy * 0.25})`;
    ctx.lineWidth   = 0.8;
    ctx.stroke();
  }

  // Cleanup fully absorbed and faded nodes
  nodes = nodes.filter(n => !(n.absorbed && n.alpha <= 0.01));

  requestAnimationFrame(loop);
}

// Initial burst following π: 3 · 1 · 4 · 1 · 5 · 9...
setTimeout(() => spawnNote('D'), 200);   // 3→D
setTimeout(() => spawnNote('B'), 900);   // 1→B
setTimeout(() => spawnNote('E'), 1700);  // 4→E
setTimeout(() => spawnNote('B'), 2600);  // 1→B
setTimeout(() => spawnNote('F'), 3600);  // 5→F
