<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>π Pride</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #000;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
  }

  #title {
    position: fixed;
    top: max(16px, env(safe-area-inset-top, 16px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.18);
    text-transform: uppercase;
    pointer-events: none;
    white-space: nowrap;
  }

  #remainder-display {
    position: fixed;
    top: max(38px, calc(env(safe-area-inset-top, 16px) + 22px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.2);
    pointer-events: none;
    white-space: nowrap;
  }

  #center-signal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0);
    pointer-events: none;
    transition: color 3s ease;
  }

  #controls {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 100;
    padding: 0 12px;
  }

  #note-row {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }

  .note-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.4);
    color: rgba(255,255,255,0.5);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.15s, background 0.15s;
  }
  .note-btn:active {
    transform: scale(0.88);
    background: rgba(255,255,255,0.1);
  }

  #mic-btn {
    padding: 0 20px;
    height: 42px;
    border-radius: 21px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.4);
    color: rgba(255,255,255,0.4);
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
    min-width: 140px;
  }
  #mic-btn:active { transform: scale(0.95); }
  #mic-btn.active {
    border-color: rgba(255,80,80,0.5);
    color: rgba(255,140,140,0.8);
  }

  #tap-hint {
    position: fixed;
    bottom: max(130px, calc(env(safe-area-inset-bottom, 20px) + 110px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.1);
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="title">π pride · the remainder that persists</div>
<div id="remainder-display">· · ·</div>
<canvas id="c"></canvas>
<div id="center-signal">∅</div>
<div id="tap-hint">tap screen · spawn π sequence</div>

<div id="controls">
  <div id="note-row"></div>
  <button id="mic-btn" id="mic-btn">activate mic</button>
</div>

<script>
// ── COSMOLOGY ─────────────────────────────────────────────
const COSMOLOGY = {
  A:{ color:'#19b7a8', world:'Teal',        idx:0, rgb:[25,183,168],  band:'sub'     },
  B:{ color:'#c8102e', world:'Solar Flare', idx:1, rgb:[200,16,46],   band:'bass'    },
  C:{ color:'#f4731c', world:'Mars',        idx:2, rgb:[244,115,28],  band:'lowmid'  },
  D:{ color:'#f4d03f', world:'Io',          idx:3, rgb:[244,208,63],  band:'mid'     },
  E:{ color:'#3a9d23', world:'Algae',       idx:4, rgb:[58,157,35],   band:'highmid' },
  F:{ color:'#1a56db', world:'Ocean',       idx:5, rgb:[26,86,219],   band:'high'    },
  G:{ color:'#7b2fbe', world:'Nebula',      idx:6, rgb:[123,47,190],  band:'air'     },
};
const NOTE_ORDER = ['A','B','C','D','E','F','G'];

// π sequence
const PI_SEQ = '14159265358979323846264338327950288419716939937510582097494459230781640628620899';
let piIdx = 0;
const PI_MAP = ['A','B','C','D','E','F','G','F','E','D'];
function nextPiNote() {
  const n = PI_MAP[parseInt(PI_SEQ[piIdx % PI_SEQ.length])];
  piIdx++;
  return n;
}

// ── CANVAS ────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, CX, CY, R;

function resize() {
  // Use devicePixelRatio but cap at 2 for mobile performance
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width  = window.innerWidth  * dpr;
  H = canvas.height = window.innerHeight * dpr;
  ctx.scale(dpr, dpr);
  CX = window.innerWidth  / 2;
  CY = window.innerHeight / 2;
  R  = Math.min(window.innerWidth, window.innerHeight) * 0.40;
}
resize();
window.addEventListener('resize', () => { ctx.resetTransform(); resize(); });

// ── AUDIO ─────────────────────────────────────────────────
let audioCtx = null, analyser = null, micStream = null;
let freqData = new Uint8Array(256), timeData = new Uint8Array(256);
let listening = false;
const waveform = new Float32Array(32); // smaller on mobile
let energy = 0;

const BANDS = {
  sub:     { lo:0,   hi:3,   val:0 },
  bass:    { lo:3,   hi:10,  val:0 },
  lowmid:  { lo:10,  hi:25,  val:0 },
  mid:     { lo:25,  hi:60,  val:0 },
  highmid: { lo:60,  hi:100, val:0 },
  high:    { lo:100, hi:150, val:0 },
  air:     { lo:150, hi:255, val:0 },
};

const micBtn = document.getElementById('mic-btn');
micBtn.addEventListener('touchend', e => { e.preventDefault(); startMic(); });
micBtn.addEventListener('click', startMic);

let micAttempts = 0;

async function startMic() {
  if (listening) return;

  // Resume or create AudioContext inside the gesture
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }

  micAttempts++;
  micBtn.textContent = 'requesting...';
  micBtn.disabled = false;

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    analyser  = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    const src = audioCtx.createMediaStreamSource(micStream);
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.frequencyBinCount);
    listening = true;
    micBtn.classList.add('active');
    micBtn.textContent = 'listening ●';
    document.getElementById('tap-hint').style.opacity = '0';
  } catch(e) {
    // Always allow retry — never permanently disable the button
    const msg = e.name === 'NotAllowedError'
      ? 'tap to allow mic'
      : e.name === 'NotFoundError'
      ? 'no mic found'
      : 'tap to retry mic';
    micBtn.textContent = msg;
    micBtn.disabled = false;
    // Pulse the button to signal it's tappable
    micBtn.style.borderColor = 'rgba(255,180,80,0.7)';
    micBtn.style.color = 'rgba(255,200,100,0.9)';
    setTimeout(() => {
      micBtn.style.borderColor = '';
      micBtn.style.color = '';
    }, 2000);
  }
}

function analyzeAudio() {
  if (!listening || !analyser) return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  for (const band of Object.values(BANDS)) {
    let sum = 0;
    for (let i = band.lo; i < band.hi; i++) sum += freqData[i];
    band.val = band.val * 0.72 + (sum / ((band.hi - band.lo) * 255)) * 0.28;
  }
  for (let i = 0; i < 32; i++) {
    waveform[i] = waveform[i] * 0.6 + ((timeData[i*8] - 128) / 128) * 0.4;
  }
  energy = (BANDS.bass.val + BANDS.mid.val + BANDS.high.val) / 3;
}

// ── NODE ──────────────────────────────────────────────────
class NoteNode {
  constructor(note, fromMic = false) {
    const c       = COSMOLOGY[note];
    this.note     = note;
    this.rgb      = c.rgb;
    this.fromMic  = fromMic;

    this.entryAngle = Math.random() * Math.PI * 2;
    this.r     = R * (0.88 + Math.random() * 0.15);
    this.angle = this.entryAngle;
    this.angularVel = -(0.006 + Math.random() * 0.006);

    this.x = CX + Math.cos(this.angle) * this.r;
    this.y = CY + Math.sin(this.angle) * this.r;

    this.size     = fromMic ? 8 + Math.random() * 4 : 5 + Math.random() * 3;
    this.baseSize = this.size;
    this.alpha    = 0;
    this.glowPulse = Math.random() * Math.PI * 2;

    this.perturbX = 0;
    this.perturbY = 0;

    // Lighter trail for mobile — warmth blooms, no lines
    this.trail    = [];
    this.maxTrail = fromMic ? 90 : 65;

    this.entryPerturbPhase = 0;
    this.entryPerturbing   = true;

    this.absorbed    = false;
    this.absorbT     = 0;
    this._registered = false;
  }

  perturb(force) {
    const a = Math.random() * Math.PI * 2;
    this.perturbX += Math.cos(a) * force;
    this.perturbY += Math.sin(a) * force;
  }

  update(dt) {
    if (this.absorbed) {
      this.absorbT += dt * 0.004;
      this.alpha    = Math.max(0, 1 - this.absorbT);
      this.size    *= 0.96;
      return;
    }

    this.alpha = Math.min(1, this.alpha + dt * 0.003);

    // Entry S-curve wobble
    if (this.entryPerturbing) {
      this.entryPerturbPhase += dt * 0.009;
      const w = Math.sin(this.entryPerturbPhase) * 2.5 * Math.exp(-this.entryPerturbPhase * 0.3);
      this.perturbX += w * Math.cos(this.angle + Math.PI/2);
      this.perturbY += w * Math.sin(this.angle + Math.PI/2);
      if (this.entryPerturbPhase > 4) this.entryPerturbing = false;
    }

    const pull   = 0.0003 + (1 - this.r / R) * 0.001;
    this.r       = Math.max(0, this.r - pull * this.r * dt);
    const vScale = 1 + Math.pow(Math.max(0, 1 - this.r/R), 2) * 3.5;
    this.angle  += this.angularVel * dt * vScale;

    this.perturbX *= 0.90;
    this.perturbY *= 0.90;

    if (this.fromMic) this.size = this.baseSize * (1 + energy * 1.2);

    this.x = CX + Math.cos(this.angle) * this.r + this.perturbX;
    this.y = CY + Math.sin(this.angle) * this.r + this.perturbY;
    this.glowPulse += dt * 0.004;

    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    if (this.r < 10) this.absorbed = true;
  }

  draw(ctx) {
    if (this.alpha <= 0.01) return;
    const [r, g, b] = this.rgb;

    // Warmth blooms — no lines, soft radial heat at past positions
    const step = Math.max(1, Math.floor(this.trail.length / 12));
    for (let i = 0; i < this.trail.length; i += step) {
      const pt    = this.trail[i];
      const prog  = i / this.trail.length;
      const warmR = this.size * (1.2 + (1 - prog) * 3.0);
      const warmA = prog * prog * this.alpha * (this.fromMic ? 0.20 : 0.12);
      if (warmA < 0.005) continue;
      const wg = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, warmR);
      wg.addColorStop(0,   `rgba(${r},${g},${b},${warmA})`);
      wg.addColorStop(0.5, `rgba(${r},${g},${b},${warmA * 0.4})`);
      wg.addColorStop(1,   `rgba(${r},${g},${b},0)`);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, warmR, 0, Math.PI * 2);
      ctx.fillStyle = wg;
      ctx.fill();
    }

    // Glow — larger and softer
    const pulse = 0.65 + 0.35 * Math.sin(this.glowPulse);
    const mb    = this.fromMic ? 1 + energy * 1.5 : 1;
    const glowR = this.size * (3.2 + pulse * 2.2) * mb;
    const grd   = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowR);
    grd.addColorStop(0,   `rgba(${r},${g},${b},${this.alpha * 0.5 * mb})`);
    grd.addColorStop(0.4, `rgba(${r},${g},${b},${this.alpha * 0.18 * mb})`);
    grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, glowR, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,245,${this.alpha * 0.95})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${this.alpha * 0.6})`;
    ctx.fill();
  }
}

// ── CENTER ────────────────────────────────────────────────
let absorbedLog   = [];
let centerColor   = [0,0,0];
let centerAlpha   = 0;
let centerPulse   = 0;
let totalAbsorbed = 0;

function computeCenter() {
  if (!absorbedLog.length) { centerAlpha = 0; return; }
  let rr = 255, gg = 255, bb = 255;
  absorbedLog.forEach((rgb, i) => {
    const w = (i+1) / absorbedLog.length * 0.7;
    rr = Math.max(0, rr - rgb[0] * w);
    gg = Math.max(0, gg - rgb[1] * w);
    bb = Math.max(0, bb - rgb[2] * w);
  });
  centerColor = [rr, gg, bb];
  centerAlpha = Math.min(0.85, absorbedLog.length * 0.13);
}

function drawCenter() {
  const [r, g, b] = centerColor;
  centerPulse += 0.018;

  // Hard black void — drawn large enough to occlude any node warmth bleeding in
  // Solid core first, then gradient fade at edge
  const voidR = 62 + energy * 14;
  ctx.beginPath();
  ctx.arc(CX, CY, voidR * 0.55, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,1)';
  ctx.fill();

  const vg = ctx.createRadialGradient(CX, CY, voidR * 0.45, CX, CY, voidR);
  vg.addColorStop(0,   'rgba(0,0,0,1)');
  vg.addColorStop(0.6, 'rgba(0,0,0,0.98)');
  vg.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(CX, CY, voidR, 0, Math.PI * 2);
  ctx.fillStyle = vg;
  ctx.fill();

  // Signal only emerges after enough absorptions — threshold raised
  if (centerAlpha > 0.35 && totalAbsorbed >= 5) {
    const pulse = 0.6 + 0.4 * Math.sin(centerPulse);
    const sigR  = 8 + pulse * 4 + energy * 10;
    const sg    = ctx.createRadialGradient(CX, CY, 0, CX, CY, sigR * 3.5);
    sg.addColorStop(0,   `rgba(${r},${g},${b},${centerAlpha * pulse * 0.8})`);
    sg.addColorStop(0.4, `rgba(${r},${g},${b},${centerAlpha * 0.3})`);
    sg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(CX, CY, sigR * 3.5, 0, Math.PI * 2);
    ctx.fillStyle = sg;
    ctx.fill();

    const label = document.getElementById('center-signal');
    label.style.color = `rgba(${r},${g},${b},${Math.min(0.55, centerAlpha * 0.7)})`;
    label.textContent = totalAbsorbed >= 7 ? 'π' : '∅';
  }

  // Axis point
  ctx.beginPath();
  ctx.arc(CX, CY, 2, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,255,255,${0.08 + energy * 0.2})`;
  ctx.fill();
}

// ── FIELD ARMS ────────────────────────────────────────────
let fieldRot = 0;

function drawFieldArms() {
  // Lighter on mobile — fewer points
  for (let arm = 0; arm < 3; arm++) {
    const base = arm * (Math.PI * 2 / Math.PI) + fieldRot;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i < 120; i++) {
      const t  = i / 120;
      const sr = t * R * 1.05;
      const sa = base + t * Math.PI * 5.14;
      const sx = CX + Math.cos(sa) * sr;
      const sy = CY + Math.sin(sa) * sr;
      if (first) { ctx.moveTo(sx, sy); first = false; }
      else ctx.lineTo(sx, sy);
    }
    const al = 0.025 + energy * 0.035;
    ctx.strokeStyle = `rgba(255,255,255,${al})`;
    ctx.lineWidth   = 0.4;
    ctx.stroke();
  }
}

function drawRings() {
  [0.2, 0.32, 0.55, 0.82, 1.0].forEach((rf, i) => {
    ctx.beginPath();
    ctx.arc(CX, CY, R * rf, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.025 + i * 0.007})`;
    ctx.lineWidth   = 0.5;
    ctx.setLineDash([3, 10]);
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

// ── SPAWN ─────────────────────────────────────────────────
let nodes = [];

function spawnNote(note, fromMic = false) {
  if (nodes.length > 22) {
    const oldest = nodes.findIndex(n => !n.absorbed);
    if (oldest !== -1) nodes[oldest].absorbed = true;
  }
  const baseAngle = Math.random() * Math.PI * 2;
  for (let i = 0; i < 3; i++) {
    const n = new NoteNode(note, fromMic);
    n.entryAngle = baseAngle + (i - 1) * 0.45 + (Math.random() - 0.5) * 0.2;
    n.r = R * (0.88 + Math.random() * 0.15);
    n.angle = n.entryAngle;
    n.x = CX + Math.cos(n.angle) * n.r;
    n.y = CY + Math.sin(n.angle) * n.r;
    n.size = n.baseSize = (fromMic ? 7 + Math.random() * 4 : 4 + Math.random() * 3) * (0.8 + i * 0.15);
    setTimeout(() => {
      nodes.forEach(ex => {
        if (!ex.absorbed) {
          const dx = ex.x - (CX + Math.cos(n.entryAngle) * n.r);
          const dy = ex.y - (CY + Math.sin(n.entryAngle) * n.r);
          if (Math.sqrt(dx*dx + dy*dy) < 120) ex.perturb(2 + Math.random() * 4);
        }
      });
      nodes.push(n);
    }, i * 120);
  }
}

// ── HUD ───────────────────────────────────────────────────
const noteRow = document.getElementById('note-row');
NOTE_ORDER.forEach(note => {
  const c   = COSMOLOGY[note];
  const btn = document.createElement('button');
  btn.className   = 'note-btn';
  btn.textContent = note;
  btn.title       = c.world;
  btn.style.borderColor = c.color + '99';
  btn.style.color       = c.color;
  // Both touch and click
  btn.addEventListener('touchend', e => { e.preventDefault(); spawnNote(note); });
  btn.addEventListener('click', () => spawnNote(note));
  noteRow.appendChild(btn);
});

// ── MIC SPAWN ─────────────────────────────────────────────
let lastMicSpawn = 0;
let micCool      = 0;
let prevEnergy   = 0;

function handleMicSpawning(now) {
  if (!listening) return;
  micCool = Math.max(0, micCool - 16);
  const delta = energy - prevEnergy;
  if (delta > 0.045 && micCool === 0 && now - lastMicSpawn > 350) {
    let domBand = 'mid', domVal = 0;
    Object.entries(BANDS).forEach(([k,v]) => { if (v.val > domVal) { domVal = v.val; domBand = k; } });
    const map = { sub:'A', bass:'B', lowmid:'C', mid:'D', highmid:'E', high:'F', air:'G' };
    spawnNote(map[domBand] || nextPiNote(), true);
    lastMicSpawn = now;
    micCool = 220;
  }
  if (energy > 0.09 && now - lastMicSpawn > 900 && micCool === 0) {
    spawnNote(nextPiNote(), true);
    lastMicSpawn = now;
    micCool = 500;
  }
  prevEnergy = energy;
}

// ── TOUCH / TAP ───────────────────────────────────────────
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  // Ignore touches on controls area
  const touch = e.changedTouches[0];
  if (touch.clientY > window.innerHeight - 120) return;
  spawnNote(nextPiNote());
}, { passive: false });

canvas.addEventListener('click', e => {
  if (e.clientY > window.innerHeight - 120) return;
  spawnNote(nextPiNote());
});

// ── REMAINDER DISPLAY ─────────────────────────────────────
function updateRemainder() {
  const active = [...new Set(nodes.filter(n => !n.absorbed).map(n => n.note))];
  const el     = document.getElementById('remainder-display');
  el.textContent = active.length ? active.join(' · ') : '· · ·';
  el.style.color = active.length
    ? 'rgba(255,255,255,0.38)'
    : 'rgba(255,255,255,0.12)';
}

// ── WAVEFORM RING ─────────────────────────────────────────
function drawWaveformRing() {
  if (!listening || energy < 0.015) return;
  ctx.beginPath();
  const wR = 60 + energy * 20;
  for (let i = 0; i < 32; i++) {
    const a    = (i / 32) * Math.PI * 2;
    const disp = waveform[i] * 18 * energy * 6;
    const px   = CX + Math.cos(a) * (wR + disp);
    const py   = CY + Math.sin(a) * (wR + disp);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.strokeStyle = `rgba(255,255,255,${0.1 + energy * 0.22})`;
  ctx.lineWidth   = 0.7;
  ctx.stroke();
}

// ── MAIN LOOP ─────────────────────────────────────────────
let last         = performance.now();
let lastAutoSpawn = 0;
let autoInterval  = 1600;

function loop(now) {
  const dt = Math.min(now - last, 50);
  last = now;
  fieldRot += 0.0007;

  analyzeAudio();
  handleMicSpawning(now);

  if (now - lastAutoSpawn > autoInterval) {
    spawnNote(nextPiNote());
    lastAutoSpawn = now;
    autoInterval  = 1300 + Math.random() * 1300 - energy * 350;
  }

  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  drawRings();
  drawFieldArms();

  nodes.forEach(n => {
    n.update(dt);
    if (n.absorbed && !n._registered && n.absorbT > 0.1) {
      n._registered = true;
      absorbedLog.push(n.rgb);
      if (absorbedLog.length > 10) absorbedLog.shift();
      totalAbsorbed++;
      computeCenter();
    }
  });

  nodes.sort((a, b) => b.r - a.r);
  nodes.forEach(n => n.draw(ctx));

  drawWaveformRing();
  drawCenter();
  updateRemainder();

  nodes = nodes.filter(n => !(n.absorbed && n.alpha <= 0.01));

  requestAnimationFrame(loop);
}

// Initial π burst
setTimeout(() => spawnNote('D'), 200);
setTimeout(() => spawnNote('B'), 900);
setTimeout(() => spawnNote('E'), 1700);
setTimeout(() => spawnNote('B'), 2600);
setTimeout(() => spawnNote('F'), 3600);
setTimeout(() => spawnNote('G'), 4800);

requestAnimationFrame(loop);
</script>
